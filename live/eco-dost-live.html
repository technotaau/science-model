mber 2026, the Delhi Pollution Control Committee (DPCC) gave an order. Idols must not be immersed in the Yamuna or any other river, lake or pond, except at special immersion sites. Idol makers were told to use natural clay and natural colours, and Plaster of Paris idols must not go into the water. Anyone who breaks the rule may have to pay ₹50,000. | LINK: My clay Ganesha follows the same idea: it is made with clay that breaks down easily in water, and daals. | MENTOR NOTE: DPCC directions dated 9 Sep 2026 under Section 33A of the Water Act, 1974 (Millennium Post/PTI 17 Sep; Deccan Chronicle 16 Sep; Tribune 17 Sep). They ban immersion in the Yamuna or other Delhi water bodies except at designated sites, with Rs 50,000 environmental compensation. Makers and sellers must use natural clay, biodegradable materials and natural dyes, and PoP idols are not allowed for immersion. Chemical paints may carry mercury, chromium, lead and cadmium. The order covers Ganeshotsav and Durga Puja, and cites the CPCB 2020 guidelines and NGT 2015 orders. Water Act violations can mean up to 6 years in jail; DMs enforce the order, and police check vehicles bringing banned idols. 'Special sites' means designated ponds, pits or tanks. Don't call PoP poison, and don't say 'PoP is banned all over India' (CPCB told the Bombay HC in July 2026 that its guidelines are advisory; LiveLaw 28 Jul 2026). Her Ganesha was made before this order, so say it 'follows the same idea', never that she made it because of the order. Mentor only: Oneindia (20 Sep) found ponds not ready at Kalindi Kunj and some idols still going into the river; don't raise it. This matches the DPCC note already on her Ganesha page.\n- [Festivals & idols; links to: ganesha] SAY: For Ganesh Visarjan in September 2026, the Delhi Government set up 81 artificial ponds in all 13 districts. People could immerse idols there without polluting the Yamuna. Flowers and decorations had to be taken off first. Broken idols and old puja items could go to collection points called 'Visarjan Patras', to be recycled. | LINK: My clay Ganesha can be immersed in a bucket at home or in an artificial pond, and puja flowers can go in the green bin. | MENTOR NOTE: 81 artificial ponds across 13 districts (ANI via webindia123, 23 Sep 2026; ThePrint and Asianet, 22–24 Sep) is the government figure; one report said 'about 90'. The main Visarjan day was Anant Chaturdashi, Fri 25 Sep 2026. Visarjan Patras: ANI said 110 collection centres in 18 clusters and Asianet said more than 250, so give no number. 'Processed for scientific recycling' is the plan, and no results were published. The DPCC order (Tribune, 17 Sep) says flowers and decorations are removed before immersion, biodegradable waste is composted and non-biodegradable waste goes for safe disposal (matching CPCB 2020 colour-coded bins). Durga Puja: the same order covered it. On 6 Oct 2026, the Delhi Government asked the Irrigation & Flood Control Department to prepare immersion pits and water, plan artificial ponds and clean the sites afterwards (Tribune). Dussehra was Tue 20 Oct 2026, so by 24 Oct Durga Puja is over: use the past tense, say what was arranged, and don't claim results. Look for a post-Dussehra report on 23 Oct. Chhath arrangements: single-window permissions from 15 Oct 2026. Her Ganesha is clay + daals with no flowers, so the link says 'puja flowers'.\n- [Campaigns & awards; links to: general] SAY: Swachhata Hi Seva 2026 started on 17 September 2026. Its theme is 'Swachhata Mein Sahbhag; Swachh Bharat, Viksit Bharat'. It means that when everyone takes part in cleanliness, India becomes clean and developed. On 1 October 2026, people cleaned about 300 places across Delhi under the slogan 'Ek Din, Ek Ghanta, Ek Saath' (One Day, One Hour, Together). | LINK: My whole model is my 'sahbhag', my way of taking part in Swachh Bharat. | MENTOR NOTE: AIR (16 Sep 2026): SHS 2026 began on 17 Sep 2026 with the theme 'Swachhata Mein Sahbhag; Swachh Bharat, Viksit Bharat'. It is run by MoHUA and the Jal Shakti ministry (DDWS), and has been held every year since 2017. The end date is unclear (UGC/CBSE say 2 Oct; AIR/PTI say 17 Oct), so say only 'started on 17 September'. Her older card ci-swachhata-hi-seva says SHS usually ends on 2 October (Gandhi Jayanti); for 2026, give only the start date. The five pillars include Swachh Paathshala (students and youth), Jan Bhagidari ('Swachh Parv, Harit Parv' for green festivals) and Swachhata se Samriddhi ('Kabaad Se Jugaad', 'Kabaad Se Kala'). The 'Class 6–12 Swachhata Gyan Yatra' detail comes from one secondary source (likely), so keep it off stage. On 1 Oct 2026, about 300 Delhi locations were cleaned (PTI via The Patriot), and the CM joined at Kamla Nehru Ridge. Separately, the Jal Shakti Ministry's drive at Kalindi Kunj Ghat had more than 1,100 volunteers. Avoid the political quotes in some reports. On Swachh Bharat Diwas, 2 Oct 2026, special Gram Sabhas across India discussed the SWM Rules 2026, with 'Ek Ped Maa Ke Naam' tree planting. Special Campaign 6.0 for government offices runs 2–31 Oct 2026.\n- [Campaigns & awards; links to: general] SAY: From 17 August to 2 October 2026, the Delhi Government ran a cleanliness campaign called 'Delhi Ko Kude Se Azadi', which means 'Freedom from Garbage'. Each month, the cleanest ward, or part of the city, could win ₹1 crore. There was also a special drive for government schools called 'Mera School, Sabse Sundar', which means 'My School, the Most Beautiful'. | LINK: Prizes for clean wards show that cleanliness is everyone's job, which is the message of my model. | MENTOR NOTE: The Tribune and Daily Pioneer (18 Aug 2026): 'Delhi Ko Kude Se Azadi – Swachhta Abhiyan 2026' was launched by CM Rekha Gupta at MCD headquarters on Monday 17 Aug 2026 and ran to 2 Oct 2026. The best ward each month gets Rs 1 crore. Exceptional work can earn up to Rs 2 crore extra, and a ward can get up to Rs 12 crore a year from the CM Development Fund. Ranking is by an independent agency, inspections and citizen complaints. The focus is the 'four Cs' (collection, cleaning, conversion, circular economy), with 70 mechanical sweepers and litter pickers and 125 C&D waste collection centres. 'Mera School, Sabse Sundar' (17 Sep–2 Oct) was for government schools, with a zero-waste campus initiative; the sources only schedule it, and no report on participation was found, so say 'there was a drive', not 'schools took part'. No winners list was found, so don't name wards. Keep it neutral: 'the Delhi Government ran it'.\n- [Campaigns & awards; links to: citytoilets] SAY: In India's cleanliness survey, Swachh Survekshan 2024-25, the New Delhi Municipal Council (NDMC) was named a 'Super Swachh League City'. This puts it among India's cleanest cities. The President of India gave the award on 17 July 2025. NDMC reported a 100% score for clean public toilets. | LINK: Clean public toilets are part of Clean India, like the two toilets in my Smart City. | MENTOR NOTE: The Tribune (18 Jul 2025): presented by President Droupadi Murmu at Vigyan Bhawan on 17 Jul 2025, in the 50,000–3 lakh population category. NDMC's own figures: 99% door-to-door collection, 87% segregation, 100% waste disposal and 100% public-toilet cleanliness (a survey score, so say 'a 100% score', not 'every toilet was clean'). The 2024-25 theme was 'Reduce, Reuse, Recycle'. Skip MCD's rank, because its category was reported inconsistently. Swachh Survekshan 2025-26 (10th edition, about 4,900 cities, theme 'Swachhata Ki Nayi Pehel – Badhayein Haath, Karein Safai Saath') had no results as of 15 Oct 2026 (web re-check; the 'SS 2025' hits are the 2024-25 awards). Check swachhsurvekshan.gov.in on 23 Oct, and if new results are out, don't present this one as the newest. On 1 Oct 2026, NDMC opened its largest community toilet at Jodhpur Mess, Pandara Road (about Rs 1 crore, NBCC CSR).\n\n=== 11. HAZE AND CLEAN AIR (North India's 2026 haze season; fact-checked) ===\n- AQI scale (CPCB National AQI): Good 0-50: Minimal impact. No special care is needed. | Satisfactory 51-100: A few sensitive people, like those with weak lungs, may feel a little breathing discomfort. | Moderate 101-200: People with asthma, lung disease or heart disease may find it uncomfortable to breathe. | Poor 201-300: Most people may feel breathing discomfort if they stay out in this air for a long time. | Very Poor 301-400: Staying out in this air for a long time can make people ill with breathing problems. | Severe 401-500: Even healthy people are affected, and people who are already ill can get much worse.\n- PM: PM means 'particulate matter': tiny bits of dust, smoke and soot floating in the air, measured in micrograms per cubic metre (µg/m³), which means millionths of a gram in a box of air 1 metre on each side. PM10 bits are 10 micrometres or smaller, about 7 times thinner than a human hair, which is about 70 micrometres thick. PM2.5 bits are 2.5 micrometres or smaller, about 30 times thinner than a hair, so they can go deep into our lungs.\n- GRAP: Stage I (AQI 201–300 (Poor)): Strict checks so that no garbage, leaves or crop waste is burnt in the open (in Delhi this is banned on every day of the year); Machines sweep roads and spray water, and building sites must use water sprays and covers to stop dust; More CNG and electric buses and Metro trips, running more often, so that people can leave their cars at home; No coal or firewood in hotel and dhaba tandoors, limits on diesel generators, and checks that vehicles have a valid pollution-check (PUC) certificate | Stage II (AQI 301–400 (Very Poor)): Parking fees go up, to make people think twice before taking the car; Roads are swept and sprinkled with water every day, with dust-settling sprays at dusty hotspots; Government offices in Delhi and nearby cities may start at different times, so that roads are less crowded | Stage III (AQI 401–450 (Severe)): Non-essential construction and demolition work stops, and stone crushers and mines close; Older cars are restricted in Delhi and nearby districts: BS-III or older petrol and BS-IV or older diesel ('BS' means Bharat Stage, India's pollution rules for vehicles; a higher number is cleaner). Sonipat was added on 28 September 2026; Classes up to Class 5 can be held in hybrid mode (in school or online); Offices may work with half their staff in office and the rest working from home | Stage IV (AQI Above 450 (Severe+)): Trucks are stopped from entering Delhi, except cleaner ones that run on CNG, LNG or electricity, or are BS-VI diesel; Construction stops even on big public projects like highways and flyovers; Classes 6 to 9 and 11 can move to hybrid mode; State governments may take extra emergency steps, like closing colleges or 'odd-even', where cars with odd and even number plates run on different days\n- Causes: Vehicles: Petrol and diesel vehicles give out smoke with tiny particles and harmful gases on every day of the year. Slow, heavy traffic adds even more, because engines keep running while vehicles crawl. | Road and building dust: Dust from roads, open ground, and building and demolition sites is thrown into the air by wheels and wind. | Factories and power plants: Factories and power plants that burn coal and other fuels send smoke and gases into the air. | Burning garbage and leaves: Burning garbage, dry leaves and plastic in the open makes thick smoke. Burning wood, coal or dung cakes for cooking and heating adds smoke too. | Burning crop stubble (parali): After the paddy (rice) harvest in October and November, some farmers in Punjab and Haryana burn the leftover straw, because they have only a short time before sowing wheat. Winds from the north-west can carry the smoke towards Delhi. How much of it reaches Delhi changes from day to day with the wind. | Cold air and temperature inversion: On cold winter nights, a layer of cold air stays near the ground with warmer air above it. The warm layer works like a lid on a pot, so smoke and dust cannot rise and spread out. | Slow winds: In winter the wind is often weak. Without a good wind, smoke and dust are not blown away, so they pile up day after day. | Firecrackers: Firecrackers fill the air with smoke for a few days around festivals. In 2026, Diwali falls on Sunday, 8 November, after the Vigyan Mela.\n- Health tips for the trip (general advice only): Check Delhi's AQI each morning on the SAMEER app or website of the Central Pollution Control Board (CPCB) before you plan the day. | On days when the AQI is above 200 (Poor or worse), don't run, jog or play hard games outside, especially in the early morning and late evening. | On those days, stay indoors as much as you can, and keep doors and windows shut in the early morning and late evening. | Keep away from roads with slow, heavy traffic and from dusty building sites. | If your parents or teacher advise it, wear a close-fitting N95 or N99 mask (a special mask that filters tiny particles) outside. Cloth masks, paper masks, handkerchiefs and scarves don't stop the tiny particles. | Drink enough water, and eat fresh fruits and vegetables. | After being outside, wash your eyes with clean running water and gargle with warm water. | If you feel breathless or dizzy, cough a lot, have chest pain, or your eyes turn red and watery, tell your teacher or parent at once so they can take you to a doctor. If you have asthma, keep your medicines with you.\n- [links to: ev; confirmed] SAY: An electric car has no exhaust pipe, so it gives out no smoke on the road. If more people in Delhi drive electric cars and scooters, there can be less exhaust smoke in the air. Charging them with electricity from solar panels, like the ones in my Smart City, is even better. | MENTOR NOTE: Her EV charger 'sends electricity from the power supply'; the solar panels are separate (on three buildings), so never say her charger is solar-powered. OECD, 'Non-exhaust Particulate Emissions from Road Transport' (Dec 2020): EVs remove exhaust emissions, but tyre wear, road wear and road dust thrown back into the air remain big PM sources (regenerative braking cuts brake wear). In 2025, coal was India's biggest source of electricity (1,247 TWh; Argus, from CEA data, Jan 2026). So 'no tailpipe smoke' is correct and 'no pollution' is wrong. Delhi EV Policy 2026 (notified 1 Jul 2026) covers NEW registrations only (electric autos from 1 Jan 2027, electric two-wheelers from 1 Apr 2028; on her d-ev-policy card), so never say petrol scooters are banned. Do NOT say 'EVs are pollution-free'.\n- [links to: bus; confirmed] SAY: One electric bus carries many people at once and gives out no tailpipe smoke, so fewer cars and less smoke are on the road. When Delhi's air turns Poor, Stage 1 of GRAP, Delhi's emergency plan for bad air, asks for more CNG and electric buses that run more often, so that more people can leave their cars at home. | MENTOR NOTE: CAQM's revision of 21 Nov 2025 moved 'augmenting CNG and electric public transport fleets with higher service frequency' (with off-peak fares) from Stage II to Stage I (Tribune, 22 Nov 2025; TeamLease RegTech summary of the CAQM order). The 28 Sep 2026 revision merged repeated transport measures into Stage I (News On AIR, 29 Sep 2026; GKToday, 30 Sep 2026). Higher parking fees remain a Stage II (Very Poor) example. The 150 new e-buses of 13 Oct 2026 (5,238 e-buses in all; ETV Bharat/UNI) are on her d-ebuses card, so don't repeat them here. Do NOT give a 'one bus = X cars' number; none was verified.\n- [links to: train; confirmed] SAY: My hydrogen train makes no diesel smoke, so a train like it adds no smoke to the haze along its route. The real one in Haryana runs to Sonipat, a city in the National Capital Region, where Delhi's GRAP plan for bad air also applies. | MENTOR NOTE: The flag-off of 17 Jul 2026 on the 89 km Jind–Gohana–Sonipat route (IANS; DT Next) is on her d-hydrogen-train card, so don't repeat it here. How clean hydrogen is depends on how it is made, so say 'no smoke from the train', never 'pollution-free'. If a judge asks: at the 28 Sep 2026 GRAP revision, Stage III curbs on BS-III petrol and BS-IV diesel cars were extended to Sonipat (News On AIR, 29 Sep 2026; GKToday, 30 Sep 2026). Do not mention ridership.\n- [links to: solar; confirmed] SAY: My solar panels make electricity from sunlight without burning anything. In 2025, coal was the biggest source of India's electricity, so more solar panels can mean less coal is burnt in power plants. | MENTOR NOTE: Coal-power generation in 2025 was 1,247 TWh, down 3.4% from 2024, India's first fall in coal power in five years (Argus, from CEA data, Jan 2026; CREA India Power Sector Review 2025). Haze and dust on panels cut their output: in a Duke University and IIT Gandhinagar study (Environmental Science & Technology Letters, 23 Jun 2017), efficiency jumped about 50% when panels left uncleaned for weeks were cleaned. So in smoggy weather, panels need regular cleaning. Don't quote percentages on stage. The Delhi rooftop-solar plan (Sep 2026) is on her Delhi cards.\n- [links to: windmill; confirmed] SAY: My windmill shows wind energy: a real wind turbine makes electricity from moving air, without burning anything. Wind matters for haze too: a strong wind blows smoke away, while calm winter air lets it pile up. | MENTOR NOTE: Her model windmill is not confirmed to make electricity (component note; card md-windmill-working), so say it 'shows wind energy'. CAQM's assessment of 30 Nov 2023: low temperatures caused frequent inversions that reduced the mixing height, and low-speed north-westerly winds brought pollutants in. Down To Earth: low wind speed and moisture trap pollutants. Example, only if asked: CAQM's press release of 29 May 2026 says Delhi's AQI 'recorded 207 on 28.05.2026 … improved to 123 on 29.05.2026', helped by 'strong winds accompanied by light rain', and GRAP Stage I was lifted. Do NOT say her windmill blows smog away: the wind point is about weather, the windmill he plastic-to-energy machine, not the factory.\n- [links to: general; confirmed] SAY: Delhi's Winter Action Plan 2026-27 was announced on 28 September 2026. From 1 November 2026 to 31 January 2027, most outdoor building and demolition work that raises dust will be stopped, and an even stricter ban will apply from 10 December 2026 to 20 January 2027. From 1 November 2026, offices are to let half their staff work from home, so fewer cars will be on the road. | MENTOR NOTE: Announced on Monday 28 Sep 2026 by Delhi's Environment Minister after a meeting with the Union Environment Minister and the CM (names not for stage; ThePrint/PTI, Outlook, Hans India and Republic World, 28 Sep 2026; Republic's 29 Sep article is a later report, so her d-no-burning note's '29 Sep' should read 28 Sep). Points not in her Delhi block: essential projects exempt from the 1 Nov–31 Jan curbs, indoor work allowed; reports disagree on exceptions to the 10 Dec–20 Jan ban (urgent government and emergency work per Hans India and Outlook; none per CSR Journal), so say 'even stricter ban'; 50% work from home for government and private offices (1 Nov–31 Jan per some reports, 1 Nov–28 Feb per Hans India); staggered office hours (MCD 8:30 am–5 pm, Delhi government 10 am–6:30 pm); parking fees doubled at authorised sites from 1 Nov 2026 (Delhi Metro sites exempt); fitness tests for about 2.5 lakh vehicles at three automated stations; daily evening AQI bulletins; 42 of 62 hotspots reported under control. Reports disagree on whether the 1 Nov vehicle-entry ban covers BS-IV or all non-BS-VI vehicles from outside Delhi: don't quote it. 'No PUC, No Fuel' was first enforced in Delhi on 18 Dec 2025 (News On AIR) and spread across Delhi-NCR from 1 Oct 2026 by CAQM Direction No. 101 (Business Today, 30 Sep 2026). Reports give an e-bus figure of 'over 700' that does not match the 5,200+ in her Delhi block: don't use it. These measures start after her fair, so say 'will', and check the news on 23 Oct in case of c   };
  const RULES = () => [
    "You are Eco-Dost, a cheerful recycling-robot buddy who helps Avni Choudhary (a Class 6 girl at Sharda Sarvhitkari Senior Secondary School, Chandigarh) understand and remember her science project “Clean India Mission and Waste Management” and her model. Her teacher is Rajnish Ma'am.",
    "Use the KNOWLEDGE below as your source of truth. It has been fact-checked: where her handwritten file has an error, the CORRECTIONS section wins — teach the corrected fact and, if useful, mention gently that her file says otherwise.",
    "How to answer:",
    "- Talk to Avni like a friendly older buddy: warm, encouraging, simple words for an 11-year-old, 1–2 emoji at most.",
    "- Keep it short: about 40–90 words. Use **bold** for the key words; a short list is fine. No headings.",
    "- If the answer comes from her project file, mention the page, like “(📒 your file, page 16)”.",
    "- End with ONE short question that checks she understood, on its own last line, starting exactly with “🎯 Quick check:”.",
    "- Never invent parts of her model. Her model has NO rainwater harvesting, exactly ONE windmill and TWO flower pots. The meanings of the LADDER and the DIGGER FIELD are unknown — tell her to ask Rajnish Ma'am.",
    "- Science rules: filtered water from her filter is clearer but NOT safe to drink; waste-to-energy is only for waste that cannot be recycled, in special plants with pollution control — never open burning, never “just burn plastic”; solar, EVs and the hydrogen train cut pollution but are not “zero impact” (it depends on how the electricity or hydrogen is made); non-biodegradable waste “does not break down easily” (not “never”).",
    "- If she asks something outside her project, answer only if it is a simple, safe school-science or cleanliness question, and begin with “This isn't in your file, but…”. Otherwise kindly bring her back to her project.",
    "- If you are not sure of a fact, say so and suggest she checks with Rajnish Ma'am. Never make up numbers or dates.",
    "- Never ask for personal information.",
    "- " + LANG[state.lang],
    "",
    "KNOWLEDGE:",
    PACK,
  ].join("\n");

  // ---------- rendering ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function md(s) {
    const lines = esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").split(/\n/);
    let html = "", inList = false;
    lines.forEach(l => {
      const t = l.trim();
      if (/^[-•]\s+/.test(t)) { if (!inList) { html += "<ul>"; inList = true; } html += "<li>" + t.replace(/^[-•]\s+/, "") + "</li>"; return; }
      if (inList) { html += "</ul>"; inList = false; }
      if (!t) return;
      if (/^🎯/.test(t)) html += '<p class="qc">' + t + "</p>";
      else html += "<p>" + t + "</p>";
    });
    if (inList) html += "</ul>";
    return html;
  }
  function bubble(who, html) {
    const m = document.createElement("div");
    m.className = "msg " + who;
    m.innerHTML = '<div class="bub">' + html + "</div>";
    feed.appendChild(m);
    feed.scrollTop = feed.scrollHeight;
    return m;
  }
  function errorBox(text, retry) {
    const e = document.createElement("div");
    e.className = "err";
    e.innerHTML = "<span>" + esc(text) + "</span>";
    if (retry) { const b = document.createElement("button"); b.className = "btn ghost"; b.type = "button"; b.textContent = "Try again"; b.onclick = () => { e.remove(); retry(); }; e.appendChild(b); }
    feed.appendChild(e); feed.scrollTop = feed.scrollHeight;
  }
  const ERR = {
    rate_limited: "Eco-Dost needs a short break. Please try again in a minute.",
    session_expired: "Please sign in to Claude again, then try.",
    refused: "Eco-Dost can't answer that one. Try asking about your project.",
    empty_completion: "That answer came out empty. Try asking in a different way.",
    invalid_json: "That didn't come out right. Tap Try again.",
    prompt_too_large: "The chat got too long. Tap New chat to start fresh.",
  };
  const OFF = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];
  function handleError(e, retry) {
    const code = e && e.code;
    if (code === "cancelled") return;
    if (OFF.includes(code)) { goOffline(); return; }
    errorBox(ERR[code] || "There was a connection hiccup.", ["rate_limited", "session_expired", "refused", "prompt_too_large"].includes(code) ? null : retry);
  }
  function goOffline() { $("#offline").hidden = false; $("#form").hidden = true; }
  function setBusy(b) { state.busy = b; $("#send").hidden = b; $("#stop").hidden = !b; $("#input").disabled = b; }
  function renderLeaves() { $("#leaves").textContent = "🍃 " + state.leaves + (state.leaves === 1 ? " leaf" : " leaves"); }

  // ---------- Ask me ----------
  const STARTERS = [
    "How does my water filter work?",
    "What are the 3 stages of ODF Plus?",
    "Explain the hydrogen train like I'm 10",
    "Why is segregation at source so important?",
    "Tell me a fun fact about biogas",
    "Help me answer: why did you choose this topic?",
  ];
  function welcome() {
    feed.innerHTML = "";
    const m = bubble("bot", "<p>Hi Avni! 👋 I'm <strong>Eco-Dost</strong>. Ask me anything about your project file or your model, and I'll explain it simply. Then I'll ask you a quick check question.</p><p class=\"note\">Tap a question to start:</p>");
    const box = document.createElement("div"); box.className = "starters";
    STARTERS.forEach(q => { const c = document.createElement("button"); c.className = "chip"; c.type = "button"; c.textContent = q; c.onclick = () => ask(q); box.appendChild(c); });
    m.appendChild(box);
    // restore the previous conversation
    state.turns.forEach(t => bubble(t.role === "user" ? "me" : "bot", t.role === "user" ? esc(t.content) : md(t.content)));
  }
  async function ask(text) {
    text = String(text || "").trim();
    if (!text || state.busy) return;
    if (!sample) { goOffline(); return; }
    $("#input").value = ""; autosize();
    bubble("me", esc(text));
    state.turns.push({ role: "user", content: text });
    const out = bubble("bot", '<p class="thinking">Eco-Dost is thinking…</p>');
    const turns = [{ role: "user", content: RULES() }, ...state.turns.slice(-12)];
    ctl = new AbortController();
    setBusy(true);
    try {
      const { text: answer, truncated } = await sample(turns, { cache: false, signal: ctl.signal, onText: ({ text }) => { out.querySelector(".bub").innerHTML = md(text); feed.scrollTop = feed.scrollHeight; } });
      out.querySelector(".bub").innerHTML = md(answer) + (truncated ? '<p class="note">The answer was cut short. Ask for one part at a time.</p>' : "");
      state.turns.push({ role: "assistant", content: answer });
      state.turns = state.turns.slice(-16);
      store.set("turns", state.turns);
    } catch (e) {
      if (e && e.text) out.querySelector(".bub").innerHTML = md(e.text) + '<p class="note">(interrupted)</p>'; else out.remove();
      state.turns.pop();
      handleError(e, () => ask(text));
    } finally { setBusy(false); ctl = null; }
  }

  // ---------- Quiz me ----------
  function leafIcons(n) {
    let s = "";
    for (let i = 0; i < 3; i++) s += '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="' + (i < n ? "leaf-on" : "leaf-off") + '" d="M5 19c0-8 6-14 15-15-1 9-7 15-15 15zm0 0 7-7"/></svg>';
    return s;
  }
  async function newQuiz() {
    if (!sample) { goOffline(); return; }
    if (state.busy) return;
    const card = document.createElement("div");
    card.className = "quiz";
    card.innerHTML = '<h2>Quiz time</h2><p class="thinking">Eco-Dost is picking a question…</p>';
    feed.appendChild(card); feed.scrollTop = feed.scrollHeight;
    ctl = new AbortController(); setBusy(true);
    try {
      const q = await sample.json(RULES() + "\n\nTASK: Ask Avni ONE quiz question about her project file or model, the kind a teacher or judge might ask. Mix easy, medium and hard. Do not repeat any of these recent questions: " + JSON.stringify(state.asked.slice(-15)) +
        '\nReply with only JSON: {"question": string, "topic": string, "level": "easy"|"medium"|"hard"}' + (state.lang === "hi" ? " (question in Hindi)" : ""), { cache: false, signal: ctl.signal });
      if (!q || !q.question) throw { code: "invalid_json" };
      state.asked.push(q.question); state.asked = state.asked.slice(-30); store.set("asked", state.asked);
      card.innerHTML = '<h2>Quiz time · ' + esc(q.level || "") + "</h2>" +
        '<p class="q">' + esc(q.question) + "</p>" +
        '<label class="note" for="qa-' + state.asked.length + '">Your answer — say it in your own words:</label>' +
        '<textarea id="qa-' + state.asked.length + '" rows="3"></textarea>' +
        '<div class="composer"><button class="btn" type="button" data-check>Check my answer</button><button class="btn ghost" type="button" data-skip>Another question</button></div>' +
        '<div data-result></div>';
      card.querySelector("[data-skip]").onclick = () => newQuiz();
      card.querySelector("[data-check]").onclick = () => grade(card, q.question);
      card.querySelector("textarea").focus();
    } catch (e) {
      card.remove();
      handleError(e, newQuiz);
    } finally { setBusy(false); ctl = null; }
  }
  async function grade(card, question) {
    const ans = card.querySelector("textarea").value.trim();
    if (!ans) { card.querySelector("textarea").focus(); return; }
    if (state.busy) return;
    const res = card.querySelector("[data-result]");
    res.innerHTML = '<p class="thinking">Eco-Dost is checking…</p>';
    card.querySelector("[data-check]").disabled = true;
    ctl = new AbortController(); setBusy(true);
    try {
      const g = await sample.json(RULES() + "\n\nTASK: Mark Avni's answer like a kind but honest teacher (Rajnish Ma'am).\nQUESTION: " + question + "\nAVNI'S ANSWER: " + ans +
        '\nScore 0–3 (3 = complete and correct, 2 = mostly right, 1 = partly right, 0 = not yet). Correct any wrong science gently. Reply with only JSON: {"score": 0|1|2|3, "praise": string (what she got right, 1 sentence), "missing": [strings — key points she missed, max 3], "modelAnswer": string (a 2–3 sentence answer she could say on stage), "tip": string (one tip on how to SAY it: pause, stress a word, eye contact)}', { cache: false, signal: ctl.signal });
      const sc = Math.max(0, Math.min(3, Number(g.score) || 0));
      state.leaves += sc; store.set("leaves", state.leaves); renderLeaves();
      const verdict = ["Let's learn this one", "Good start", "Very good", "Excellent"][sc];
      res.innerHTML = '<div class="score">' + leafIcons(sc) + "<span>" + verdict + " · +" + sc + (sc === 1 ? " leaf" : " leaves") + "</span></div>" +
        (g.praise ? '<div class="res-block res-good"><b>What you got right</b>' + esc(g.praise) + "</div>" : "") +
        (g.missing && g.missing.length ? '<div class="res-block res-miss"><b>Add these points</b><ul>' + g.missing.map(m => "<li>" + esc(m) + "</li>").join("") + "</ul></div>" : "") +
        (g.modelAnswer ? '<div class="res-block res-model"><b>A strong answer</b>' + esc(g.modelAnswer) + "</div>" : "") +
        (g.tip ? '<p class="note">🎤 ' + esc(g.tip) + "</p>" : "") +
        '<div class="composer"><button class="btn" type="button" data-next>Next question</button></div>';
      res.querySelector("[data-next]").onclick = () => newQuiz();
    } catch (e) {
      res.innerHTML = "";
      card.querySelector("[data-check]").disabled = false;
      handleError(e, () => grade(card, question));
    } finally { setBusy(false); ctl = null; }
  }

  // ---------- controls ----------
  function setMode(m) {
    state.mode = m;
    $("#modeAsk").setAttribute("aria-pressed", String(m === "ask"));
    $("#modeQuiz").setAttribute("aria-pressed", String(m === "quiz"));
    $("#form").hidden = m === "quiz" || !$("#offline").hidden;
    if (m === "quiz") newQuiz(); else { feed.scrollTop = feed.scrollHeight; $("#input").focus(); }
  }
  $("#modeAsk").onclick = () => setMode("ask");
  $("#modeQuiz").onclick = () => setMode("quiz");
  document.querySelectorAll(".seg.lang button").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang));
    b.onclick = () => { state.lang = b.dataset.lang; store.set("lang", state.lang); document.querySelectorAll(".seg.lang button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); };
  });
  $("#clear").onclick = () => { if (ctl) ctl.abort(); state.turns = []; store.set("turns", []); welcome(); if (state.mode === "quiz") setMode("ask"); };
  $("#stop").onclick = () => { if (ctl) ctl.abort(); };
  $("#form").addEventListener("submit", e => { e.preventDefault(); ask($("#input").value); });
  function autosize() { const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(140, t.scrollHeight) + "px"; }
  $("#input").addEventListener("input", autosize);
  $("#input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask($("#input").value); } });

  renderLeaves();
  welcome();
  if (window.claude && window.claude.use) {
    window.claude.use("sample").then(s => { sample = s; if (!s) goOffline(); }).catch(() => goOffline());
  } else goOffline();
})();
</script>
