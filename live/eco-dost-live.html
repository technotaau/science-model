  const PACK = "=== 1. AVNI'S HANDWRITTEN PROJECT FILE (transcribed; pages 9-28; pages 1-8 were not provided) ===\n(PDF has file pages 9–28; file pages 1–8 were not provided. Page numbers are the handwritten ones.)\n\n## p9 (continues from p8, missing)\n- \"...(108% of its baseline target) and over 6.3 lakh Community & Public Toilets (125% of its baseline target).\"\n- DUMPSITE REMEDIATION: Intensive scientific clearance of legacy dumpsites (reclaiming large tracts of land previously locked under mountains of urban waste) is ongoing across thousands of cities.\n- SAFAIMITRA SECURITY: Over 3,150 cities have institutionalized the SafaiMitra Surakshit Shehar protocol, eliminating hazardous manual entry into sewers by shifting completely to mechanized cleaning equipment and securing worker safety.\n- Quote: \"A Clean India is not just a dream; it is a responsibility we share.\"\n\n## p10 Green Energy Goals\n- WASTE-TO-ENERGY (WTE): converting municipal solid waste into usable power helps reduce landfill overflow while generating eco-friendly electricity.\n- NATIONAL GREEN HYDROGEN MISSION: aiming to make India a hub for green hydrogen production by 2030 to lower fossil fuel dependence and carbon output.\n- RENEWABLE ENERGY EXPANSION: targeting 500 GW of non-fossil fuel capacity by 2030 as part of national climate commitments.\n- GREEN CITY INITIATIVES: transitioning urban centres to rely more heavily on solar power and clean electric mobility.\n\n## p11–12 Waste-to-Energy\n- WTE is the process of generating energy (electricity, heat or fuel) from non-recyclable residual waste materials. Dual purpose: reduces garbage going to overflowing landfills and generates power without depleting fossil fuels.\n- Under the Clean India Mission, WTE is considered a foundational pillar for building clean, smart cities with minimal carbon footprints.\n- Core technologies: thermal or biological.\n- INCINERATION (DIRECT COMBUSTION): the most common commercial method. Unprocessed or semi-processed municipal solid waste (MSW) is burned at exceptionally high temperatures (850°C – 1400°C) to boil water. The resulting steam spins a turbine to produce electricity.\n- ANAEROBIC DIGESTION (BIOMETHANATION): microbes break down organic wet waste (like kitchen remnants and agricultural runoff) in the absence of oxygen. Yields biogas, which can be purified into Compressed Bio-Gas (CBG) for vehicles or electricity generation.\n- CURRENT STATUS OF WTE IN INDIA: India has scaled its focus on converting \"Waste to Wealth\" through targeted national policies.\n  - Capacity Growth: India's overall waste-to-energy capacity has jumped from 230 MWeq in 2014 to 877 MWeq.\n\n## p13\n- Financial Schemes: the Ministry of New and Renewable Energy (MNRE Waste to Energy Programme) offers substantial Central Financial Assistance to project developers establishing biogas and electricity infrastructure.\n- Gobardhan Scheme: the government is setting up 500 new Waste-to-Wealth plants across urban and community clusters, focusing primarily on compressed biogas production (CH4, methane).\n- The Regulatory Shift: the updated Solid Waste Management Rules mandate strict four-stream segregation at the household level. Proper source segregation is vital, because high-moisture unsegregated waste drastically reduces the operational efficiency of thermal WTE plants.\n- Quote: \"Cleanliness in India cannot just be an October 2nd photo-op. It has to be an everyday civic ritual.\"\n\n## (unnumbered) ODF VILLAGES\nODF stands for Open Defecation Free. An ODF village is a village where people do not defecate in the open and all households have access to and use toilets. It promotes cleanliness, hygiene and a healthy environment. It also reduces the spread of diseases, protects drinking-water sources from contamination and makes the village safer and more comfortable for everyone. Thus, an ODF village is an important step towards a clean, healthy and developed India.\n\n## p14 3 Progressive Stages of an \"ODF Plus\" Village\nAn ODF Plus village is one that successfully sustains its ODF status, ensures proper garbage and wastewater management and remains visually clean. Three rungs:\n1. ODF Plus Aspiring: sustains zero-open-defecation status and has operational arrangements for either Solid Waste Management (garbage collection/composting) or Liquid Waste Management (greywater drainage/soak pits).\n2. ODF Plus Rising: sustains ODF status and has functional infrastructure handling both solid and liquid waste streams.\n3. ODF Plus Model: the highest tier. Manages both waste streams, maintains visual cleanliness and actively displays public sanitation awareness messages.\n\n## p15 Green Energy\nGreen energy is energy produced from natural and renewable sources that cause little pollution. Reduces use of fossil fuels like coal and petroleum; reduces greenhouse gas emissions; conserves natural resources. Examples: solar, wind, hydropower, tidal. Solar panels use sunlight to generate electricity; wind turbines use wind. Useful in homes, schools, farms, industries. Reduces air pollution, protects wildlife and habitats, reduces dependence on non-renewable sources.\n\n## p16 National Green Hydrogen Mission\n- India's National Green Hydrogen Mission is a comprehensive initiative launched in January 2023 with an initial financial outlay of ₹19,744 crore to establish a domestic green hydrogen ecosystem and position the country as a global clean energy hub.\n- PM Narendra Modi flagged off India's first indigenously developed hydrogen fuel cell passenger train on July 17, 2026, from the Jind Railway Station in Haryana. Historic milestone in Indian Railways' clean energy initiative, putting India into an elite global club of nations operating hydrogen-powered rail traction.\n- THE ROUTE: the train operates on the 89 km Jind–Gohana–Sonipat stretch of the Northern Railway. It covers 12 intermediate stations, taking about 2 hours to complete the journey.\n\n## (unnumbered, boxed) Wind\n- Wind energy is handled under the National Wind Energy Mission. It serves as a pillar in cleaning India's air quality and reaching net-zero carbon emissions by 2070.\n- India ranks 4th globally in installed wind power capacity.\n- THE PATH TO 2030: to achieve a pollution-free, clean energy mix, India has set clear milestones for wind energy capacity.\n\n## p17 Wind Energy\nEnergy obtained from the movement of air; renewable and clean. Wind turbines convert the energy of moving wind into electricity. Wind farms in open areas, coastal regions, places with strong and regular winds. Wind turns the blades of a turbine, which helps generate electricity. Does not require fuel, very little air pollution during operation. Needs suitable windy locations.\n\n## (unnumbered)\n- SOLAR-OPERATED MOBILE TOILETS: To sustain ODF zones, the mission utilizes mobile, solar-powered community toilets. These public units use rooftop solar panels to power internal lighting and water pumps, making them completely self-reliant in public spaces or remote fairs.\n- SELF-SUSTAINING SCHOOLS: Solar energy directly feeds into the Swachh Vidyalaya (Clean Schools) component. By mounting net-metered rooftop solar arrays on government school buildings, institutions generate their own power.\n\n## p18 Solar Energy\nEnergy we get from the Sun; renewable and clean; no air pollution while generating electricity. Solar panels, also called photovoltaic panels, convert sunlight into electrical energy. Rooftop panels on houses, schools, buildings power lights, fans. Solar cookers, solar water heaters, street lights. Will not run out as long as the sun shines. Especially useful in areas with plenty of sunlight.\n\n## p19 Afforestation\nPlanting trees and creating new forests on land not previously covered by forests. Trees absorb carbon dioxide and release oxygen, reduce air pollution, maintain balance of gases, prevent soil erosion, conserve water, reduce effects of climate change, provide shelter and food for wildlife. Government, schools, communities organise tree-planting drives. Helps maintain rainfall, conserve biodiversity, provide fruits, wood, medicines.\n\n## p20 Waste Management\nWaste management under SBM has evolved from basic cleanliness and open-defecation elimination into a structural, nationwide push for scientific solid and liquid waste processing.\nCore pillars:\n- Segregation at Source: separating wet and dry waste directly in households and commercial spaces.\n- Resource Recovery: shift from dumping in landfills to processing organic waste into manure, biogas and electricity, alongside plastic recycling loops.\n- Rural SBM-G Phase II (ODF Plus): village-level infrastructure on four key areas: biodegradable waste, plastic waste, greywater management and faecal sludge management.\n(unnumbered) \"Waste segregation is the vital process of sorting garbage at the source into distinct categories like wet, dry and hazardous waste to make recycling efficient and protect the environment.\"\n\n## p21 Management of Biodegradable Waste\n1. Composting/Vermicomposting: the most common method to recycle organic waste into nutrient-rich soil.\n2. Biogas generation: breaks down organic waste in an oxygen-free environment. Biogas production: microorganisms decompose the waste to produce methane and carbon dioxide. Energy capture: gas used for cooking, heating or generating electricity.\n\n## (unnumbered) Plastic Man of India\nDr. Rajagopalan Vasudevan, a chemistry professor from Madurai, Tamil Nadu, is globally renowned as the \"Plastic Man of India\". He pioneered a technology that converts shredded single-use plastic waste into highly durable, eco-friendly roads. Honoured with the Padma Shri in 201[8]. He gifted his patented technology to the Government of India for free. It has since become a cornerstone of the Swachh Bharat Abhiyan and the Waste to Wealth national initiative.\n\n## p22 Management of Non-Biodegradable Waste\n- Single-use plastics (SUPs): disposable plastic made mainly from petrochemicals (fossil fuels), designed to be used once for a very short time. Examples: grocery bags, straws, coffee stirrers, soda bottles, product packaging.\n- ECO-BRICK: a reusable building block made by packing clean, dry, non-recyclable single-use plastic waste tightly into an empty plastic beverage bottle until it is solid and rigid enough to support structural weight. Eco-bricks are crucial to the Clean India Mission because they isolate low-value, non-recyclable single-use plastics right at the source.\n\n## p23 7Rs\n\"We often hear about the 3Rs – Reduce, Reuse, Recycle, but waste management can be taken a step further with the 7Rs.\" Refuse, Reduce, Reuse, Repair, Repurpose, Recycle, Recover. \"So, the 7Rs teach us an important lesson: 'The best waste is the waste we never create.'\"\nCONCLUSION: The Clean India Mission is not only a government programme but also a responsibility for every citizen. Modern technologies such as AI, robotics, smart bins and waste-to-energy plants are helping India become cleaner every day.\n\n## p24–26 Multi-layer gravity filter\n- Commonly used as a low-cost, preliminary filtration system. \"Stone\" = gravel/sand, \"cotton\" = fine physical barrier, \"charcoal\" = chemical purifier.\n- Excellent for removing large particles and certain chemical impurities, but generally not enough on its own to make industrial chemical wastewater safe for rivers without additional chemical or biological treatments.\n- Stones/Gravel/Sand (physical filtration): first line of defence; traps large debris like leaves, twigs, plastics, heavy suspended sediments.\n- Charcoal/Activated Carbon (chemical adsorption): the most critical step for chemical water. Millions of microscopic pores trap organic chemicals, chlorine, heavy metals and volatile organic compounds (VOCs) through adsorption (binding molecules to its surface). Also removes bad odours and discoloration.\n- Cotton/Filter cloth (fine filtration): final physical barrier; traps tiny particles and charcoal dust.\n- Structure: water must flow from the coarsest to the finest material. 1. TOP (inflow): coarse stones and gravel. 2. Second: fine sand. 3. Third: crushed charcoal. 4. BOTTOM: thick layer of cotton or tightly woven cloth.\n- Drawing: an upside-down bottle with layers.\n- Quote: \"Cleanliness is not a job we should do forcefully. It is a good habit and healthy way of our life!\"\n\n## (drawing) Puja material collection box: \"कृपया पूजा सामग्री यहाँ पर डालें\" with 4 compartments: फूल (flowers), वस्त्र (cloth), प्लास्टिक (plastic), अन्य सामग्री (other items).\n\n## p27–28 How we can keep our rivers clean in Clean India Mission?\nWe can keep our rivers clean under the Clean India Mission by stopping waste at the source, treating wastewater and involving local communities.\nIndividual and community actions:\n- Stop dumping garbage: never throw household trash, plastic bags or puja offerings directly into rivers or water bodies. Use local dustbins or designated collection systems like 'Puja Banks'.\n- Reduce plastic use: cut down on single-use plastics to prevent floating waste reaching river currents and choking aquatic ecosystems.\n- Participate in cleanups: join local community river-cleaning drives, awareness campaigns and volunteer programmes near riverbanks and ghats.\n- Plant trees: grow local flora and trees along riverbanks to prevent soil erosion, filter runoff water and maintain healthy ecosystems.\nGovernment and industrial measures:\n- Treat sewage: build and expand Sewage Treatment Plants (STPs) so untreated human waste and domestic greywater do not flow straight into rivers.\n- Regulate industrial waste: enforce strict laws forcing factories to treat toxic chemical effluents before any discharge.\n- River surface cleaning: deploy mechanized trash skimmers, boom barriers and conveyor belt systems to collect floating solid waste from major rivers and canals.\n(drawing) Stop dumping garbage / Reduce plastic use / Join cleanups.\n\n## Our Duties Towards Our Nation\nStop littering · Segregate waste · Maintain public cleanliness · Promote behavioral change · Spread awareness · Plant more trees · Use public transport · Focus on recycling · Car pooling\n\n\n=== 2. CORRECTIONS TO HER FILE (fact-checked Oct 2026 — these WIN over the file) ===\n- [p9] File says: \"Over 3,150 cities have the SafaiMitra Surakshit Shehar protocol\" → CORRECT: More than 500 cities have promised to clean sewers with machines instead of sending people inside. Chandigarh has won an award for keeping its SafaiMitras safe. (why: No source for 3,150; the official count is 500 cities (2022).)\n- [p9] File says: \"eliminating manual entry … shifting completely to machines\" → CORRECT: Cities are working to replace dangerous manual sewer cleaning with machines. There is still work to do. (why: Sewer deaths still happen, so “eliminating” and “completely” are not true yet.)\n- [p9] File says: \"dumpsite clearance … across thousands of cities\" → CORRECT: India has about 2,500 old dumpsites; more than 1,000 have been fully cleared. (why: The number is about 2,500 dumpsites, not thousands of cities. (Don't say Chandigarh's Dadu Majra dumpsite is finished.))\n- [p11] File says: \"WTE is a foundational pillar of the Clean India Mission\" → CORRECT: Waste-to-energy is one important way to use leftover waste that cannot be recycled or composted. (why: Reduce, segregate, recycle and compost come first; WTE is for leftovers.)\n- [p12] File says: \"burned at 850°C – 1400°C\" → CORRECT: burned at very high temperatures, usually above 850°C (why: City-waste incinerators run at about 850–1100°C; 1400°C is not normal.)\n- [p12] File says: \"wet waste like kitchen remnants and agricultural runoff\" → CORRECT: wet waste like kitchen scraps, cow dung and crop leftovers (why: Runoff is water flowing off fields — it does not go into a biogas plant.)\n- [p12] File says: \"capacity jumped from 230 MWeq in 2014 to 877 MWeq\" → CORRECT: from about 230 MW in 2014 to about 878 MW in 2026 — almost four times bigger (why: Latest MNRE figure: 878.4 MW (31 Aug 2026). Add the year.)\n- [p13] File says: \"MNRE Waste to Energy Programme offers financial assistance\" → CORRECT: MNRE's National Bioenergy Programme (2021–2026) helped fund waste-to-energy plants. In August 2026 a new GOBARdhan scheme of ₹23,731 crore was approved. (why: The old programme ended in 2025-26.)\n- [p13] File says: \"Gobardhan: 500 new plants, focusing primarily on compressed biogas\" → CORRECT: In the 2023 Budget, 500 new ‘Waste to Wealth’ plants were announced under GOBARdhan — 200 compressed biogas and 300 community plants. (why: Most of the 500 are community plants; add the year.)\n- [p10] File says: \"make India a hub for green hydrogen by 2030\" → CORRECT: India wants to be a global hub for green hydrogen and make at least 5 million tonnes a year by 2030. (why: The official 2030 goal is the 5 million tonnes number.)\n- [p16] File says: \"an elite global club of nations operating hydrogen trains\" → CORRECT: India joined a small group of countries, like Germany, that run hydrogen passenger trains. (why: “Elite club” sounds like an official group.)\n- [Wind box] File says: \"handled under the National Wind Energy Mission\" → CORRECT: Wind energy is looked after by the Ministry of New and Renewable Energy (MNRE), with the National Institute of Wind Energy in Chennai. (why: A National Wind Energy Mission was proposed but never launched.)\n- [Wind box] File says: \"India has set clear milestones for wind capacity\" → CORRECT: India aims for about 100 GW of wind power by 2030; it has about 58 GW now. (why: Give the actual number — a judge may ask what the milestones are.)\n- [Solar page] File says: \"the mission uses mobile solar toilets … completely self-reliant\" → CORRECT: Some places, like Haryana, use mobile toilets with solar panels that power the lights and water pumps. (why: These are local projects, and they still need water and emptying.)\n- [Solar page] File says: \"Solar directly feeds into Swachh Vidyalaya\" → CORRECT: Many government schools have rooftop solar panels; Swachh Vidyalaya gave schools clean toilets and drinking water. (why: Swachh Vidyalaya is about toilets and water — it has no solar part.)\n- [After p20] File says: \"sorting into wet, dry and hazardous waste\" → CORRECT: sorting into four types: wet, dry, sanitary and special care waste (new rules, 1 April 2026) (why: The 2026 rules use four streams.)\n- [Plastic Man] File says: \"a cornerstone of Swachh Bharat and Waste to Wealth\" → CORRECT: Since 2015 the government has asked road builders near big cities to use waste plastic, so his idea helps keep plastic out of our streets. (why: “Cornerstone” is an exaggeration.)\n- [p22] File says: \"Eco-bricks are crucial to the Clean India Mission\" → CORRECT: Eco-bricks are a simple way schools and communities can help the Clean India Mission. (why: Helpful, but not an official part of the mission.)\n- [p25] File says: \"charcoal traps heavy metals\" → CORRECT: charcoal holds many chemicals, chlorine, colour and smells — but not germs, and not all metals (why: Home-made charcoal removes very little metal.)\n- [p24] File says: \"excellent for removing large particles and certain chemicals\" → CORRECT: My filter makes water look much clearer, but it does not kill germs — the water must be boiled or treated before drinking. (why: Always add the safety line; judges often ask “Can we drink it?”)\n- [p27] File says: \"designated collection systems like ‘Puja Banks’\" → CORRECT: special puja-material collection bins, like the one in my drawing, so flowers can become compost (why: “Puja Bank” is not a known term; “collection bins” is safe.)\n\n=== 3. VERIFIED FACTS ===\n- Swachh Bharat (Urban): about 63.8 lakh home toilets (108% of the target) and about 6.36 lakh community & public toilet seats (125%).\n- About 5.69 lakh villages were ODF Plus by September 2026 (about 5.25 lakh in the highest ‘Model’ stage).\n- National Green Hydrogen Mission: approved 4 January 2023, ₹19,744 crore.\n- Hydrogen train: flagged off 17 July 2026 at Jind; 89 km Jind–Gohana–Sonipat; 12 intermediate stations; about 2 hours.\n- India is 4th in the world in installed wind power, and 3rd in total renewable energy capacity.\n- 500 GW non-fossil power by 2030 is India's goal — India crossed 300 GW in July 2026.\n- Net-zero emissions by 2070 (announced at COP26, Glasgow, 2021).\n- 19 single-use plastic items have been banned in India since 1 July 2022.\n- Namami Gange uses trash skimmers to collect floating waste from the Ganga.\n\n=== 4. HER MODEL (one green wooden base, all on one level) ===\n* Solar Panels (3 buildings) [city]: Three buildings. Two have handmade cardboard/paper solar panels. One has a REAL working solar panel that lights an LED/bulb in sunlight.\n   - Solar energy is energy from sunlight.\n   - Solar panels change sunlight directly into electricity.\n   - It is renewable — the Sun will keep shining for billions of years.\n   - Using solar power means burning less coal for electricity, so less smoke and fewer greenhouse gases.\n   ! careful: Do NOT say solar energy has zero effect on the environment. Making panels uses energy and materials, and old panels must be recycled properly.\n   ! careful: Say “reduces” pollution, not “stops all” pollution.\n* Toilets 1 & 2 (City) [city]: Two toilets in the Smart City (one male sign, one female sign).\n   - Toilets are the sanitation part of the Clean India Mission.\n   - Using toilets stops open defecation.\n   - Human waste has germs. If it is left in the open, flies and rainwater carry germs to food and water.\n   - Separate toilets also give safety and dignity, especially to girls and women.\n   ! careful: Don't say “there is no open defecation anywhere now”. Say “the mission greatly improved toilet access; we must keep using and maintaining them.”\n* EV Charging Station + Car [city]: An EV charging station with a white car. When the button is pressed, a green light glows to show charging.\n   - EV means Electric Vehicle. It runs on a battery and an electric motor, not petrol or diesel.\n   - It has no exhaust pipe smoke while running, so the air in the city stays cleaner.\n   - Demonstrate: press the button — the green light shows charging.\n   - The full benefit depends on how the electricity is made. Electricity from solar or wind makes EVs even cleaner.\n   ! careful: Don't say “EVs cause no pollution at all”. Say “no pollution from the exhaust while running” / “less local air pollution”.\n* Electric Bus Stand [city]: A bus stand with two electric buses.\n   - Public transport: one bus carries many people, so fewer cars are on the road.\n   - Electric buses have no tailpipe smoke.\n   - Fewer vehicles + no exhaust = cleaner air, less noise, less fuel burnt.\n   ! careful: The benefit still depends partly on how the electricity is produced.\n* Hydrogen Train (Jind ↔ Sonipat) [front]: A hydrogen train on a railway track, labelled Jind ↔ Sonipat.\n   - This is India's first hydrogen train, on the Jind–Sonipat route in Haryana.\n   - It uses hydrogen in fuel cells to make its own electricity.\n   - The main thing that comes out is water vapour, not diesel smoke.\n   - Whether it is really ‘green’ depends on how the hydrogen is made.\n   ! careful: Don't say “it produces only water and no pollution at all”. Say “the main onboard by-product is water vapour”.\n   ! careful: Don't say hydrogen is burnt like diesel. It is used in a fuel cell.\n   ! careful: Don't give dates/numbers you are not sure of. The safe line is: “It was flagged off in July 2026 on the Jind–Sonipat route.”\n* India Map + “Carbon Emission” [centre]: An India-shaped tricolour design in the centre, with the words CARBON EMISSION written below it (with a city skyline).\n   - Carbon emission means releasing carbon dioxide (CO₂) into the air.\n   - It mostly comes from burning fossil fuels — coal, petrol, diesel — and from burning garbage.\n   - Too much CO₂ traps heat and causes global warming.\n   - Many parts around this map — solar, wind, EVs, the hydrogen train, biogas — help reduce carbon emissions.\n   ! careful: Global warming is ‘mainly’ caused by human activities today — avoid saying ‘only’.\n* Ladder (centre) [centre, some details still to confirm with Rajnish Ma'am]: A ladder in the centre of the model, below the words Carbon Emission. It is NOT on the road.\n   - (Ask Rajnish Ma'am what the ladder represents before you explain it.)\n   ! careful: Do not invent a meaning. Once Ma'am tells you, write it here in content.js.\n* Windmill [centre]: ONE windmill (wind turbine).\n   - A windmill (wind turbine) makes electricity from moving air.\n   - Wind is renewable — it will not run out.\n   - No smoke is produced while it runs.\n   ! careful: Don't claim your model windmill makes electricity unless it really does.\n* Two Flower Pots / Park [centre]: TWO flower pots in the central park area.\n   - Green spaces make a city healthier and more beautiful.\n   - Plants take in carbon dioxide and give out oxygen during photosynthesis.\n   ! careful: There are only TWO pots. Don't describe gardens or trees that are not in the model.\n* Five Dustbins [front, some details still to confirm with Rajnish Ma'am]: Five bins: GREEN (Wet waste), BLUE (Dry waste), BLACK, RED and YELLOW.\n   - Waste segregation at source means separating waste where it is created — at home, in school, in shops.\n   - GREEN = Wet waste — kitchen waste, peels, leftover food → compost or biogas.\n   - BLUE = Dry waste — paper, plastic, metal, glass → sent for sorting and recycling.\n   - BLACK = Domestic hazardous waste — batteries, bulbs/tube lights, broken glass, paint containers (Chandigarh system — confirm with Ma'am).\n   ! careful: Say “in Chandigarh's system” when you explain black and red — colours can differ from city to city.\n   ! careful: Don't say “all dry waste is non-biodegradable” — paper and cardboard are dry but biodegradable.\n   ! careful: Don't mix the hospital meaning of RED (contaminated plastic) with the household meaning (sanitary waste).\n* Plastic Man of India [centre]: A picture of Professor Rajagopalan Vasudevan.\n   - Professor Rajagopalan Vasudevan is called the Plastic Man of India.\n   - He found a way to use waste plastic to build roads.\n   - He received the Padma Shri in 2018.\n   ! careful: Don't say he ‘invented plastic’ or that plastic roads ‘solve the whole plastic problem’. Reducing plastic use is still most important.\n* Handmade Hut [village]: A handmade village hut.\n   - The Smart Village shows that villages can also be clean, healthy and use renewable energy.\n   ! careful: Don't describe extra things (solar lights, rainwater harvesting, crops) that are not in the model.\n* Digger Field [village, some details still to confirm with Rajnish Ma'am]: A field area with a toy digger (JCB) and a fence.\n   - (Ask Rajnish Ma'am what the digger field represents before you explain it.)\n   ! careful: Do not invent crops or technologies that are not in the model.\n* Village Toilet [village]: One toilet in the Smart Village.\n   - Villages also need toilets — this was one of the main goals of Swachh Bharat Mission (Grameen).\n   - It prevents open defecation and protects ponds, wells and fields from germs.\n   ! careful: Don't say it is connected to the biogas plant unless it really is in your model.\n* Biogas Plant [village]: A biogas plant in the Smart Village, with a pipe to a stove/flame.\n   - Biogas is made when cow dung, food waste and plant waste rot WITHOUT oxygen.\n   - This process is called anaerobic digestion.\n   - Biogas is mainly methane + carbon dioxide. It is used for cooking, heating or electricity.\n   - The leftover slurry is a good fertilizer.\n   ! careful: Biogas also produces CO₂ when burnt — say it is ‘cleaner than firewood/cow-dung cakes’, not ‘completely pollution-free’.\n* Sugar & Leather Industry [front]: A factory labelled ‘Sugar & Leather Industry (Dirty Water)’ with chimneys, connected by pipes to a pump and the water treatment setup.\n   - Factories like sugar mills and leather tanneries release dirty water (wastewater) full of chemicals.\n   - If it goes directly into rivers, it kills fish and pollutes drinking water.\n   - So industries must treat it in an Effluent Treatment Plant (ETP) before reusing or releasing it.\n   ! careful: Don't mix up your simple filter demo with a full ETP. Say “my filter shows only the first, simple step of cleaning water”.\n* Water Treatment / Filtration [front]: Dirty water (pumped from the factory) → a multi-layer gravity filter → clean-looking water in a separate tank. Layers from TOP to BOTTOM (as in my project file): stones & gravel → sand → charcoal → cotton.\n   - This is a simple filtration demonstration — a basic water-cleaning step.\n   - Water flows from the COARSEST layer to the FINEST: stones & gravel → sand → charcoal → cotton.\n   - Stones and gravel (top) hold back big particles like leaves, twigs and mud.\n   - Sand removes smaller dirt particles.\n   ! careful: NEVER say “this makes water completely safe to drink”.\n   ! careful: If your model filter has no sand layer, skip the word “sand” when you point at it.\n* Plastic-to-Energy Machine [front, some details still to confirm with Rajnish Ma'am]: A handmade machine (with a red ‘fire’ chamber) and a separate unit with a bulb, placed apart with a visible gap. When activated, the bulb glows to show electricity.\n   - This machine shows the idea of Waste-to-Energy.\n   - Plastic and waste that CANNOT be recycled is treated at very high temperature in special closed plants.\n   - The heat boils water into steam, the steam turns a turbine, the turbine turns a generator, and we get electricity.\n   - These plants must have pollution-control systems. We should NEVER burn plastic in the open.\n   ! careful: NEVER say “we simply burn plastic and get electricity”.\n   ! careful: Confirm with Ma'am what each of the two separate machines represents.\n* Eco-friendly Ganesha (clay + daals) [front, some details still to confirm with Rajnish Ma'am]: My eco-friendly Ganesha idol, made with clay that breaks down easily in water, and daals (pulses). (Still to write here: its size, colours, which clay, which daals, how the daals are used, and where it sits on the model.)\n   - Many Ganesha idols are made of Plaster of Paris (PoP), painted with chemical paints and decorated with plastic or thermocol.\n   - PoP does not dissolve easily in water. It stays in the water for a long time and slowly changes the water. Some chemical paints contain harmful metals. This can harm fish and other water animals.\n   - So I made my Ganesha with clay that breaks down easily in water, and daals (pulses), which are natural and biodegradable.\n   - The best way to immerse it is at home, in a bucket of water. The water can go to plants, and the mud can be reused.\n   ! careful: Don't say PoP ‘never’ dissolves. Say it ‘does not dissolve easily’ or ‘takes a very long time’.\n   ! careful: Don't call PoP ‘poison’. Doctors use it for plaster casts, and the MPCB study says ‘PoP is not toxic’. The problem is that it does not dissolve easily and it changes the water. The harmful metals mainly come from chemical paints.\n   ! careful: Don't say a clay idol causes ‘zero’ pollution. Clay makes water muddy for a while, and thousands of idols add a lot of mud. That is why immersing at home or in an artificial pond is best.\n   ! careful: Don't say daals are ‘fish food’ or ‘good for the river’. Say they are natural and biodegradable, and best returned to the soil.\n   ! careful: Don't say ‘PoP is banned all over India’. Say: ‘CPCB's guidelines say PoP idols should be banned, but states and cities make the rules. In Delhi, PoP idols must not be immersed in water bodies.’\n   ! careful: At Malerkotla you said ‘dissolved clay’. Clay does not truly dissolve like sugar or salt: it soaks up water, breaks into tiny bits and settles as mud. So say ‘clay that breaks down easily in water’. Only call it ‘natural clay’ if it really is, and only describe the colours and daals you really used.\nStill to confirm with Rajnish Ma'am: Does our model follow Chandigarh's bin system (BLACK = domestic hazardous waste, RED = sanitary waste)? And what does the YELLOW bin stand for — biomedical waste? Where do expired medicines go — black or red? | What does the LADDER below “Carbon Emission” represent? | What does the DIGGER FIELD represent — a farm field being dug, a compost pit, a landfill, or something else? | My project file says the filter layers from TOP to BOTTOM are: stones & gravel → sand → charcoal → cotton. Does my MODEL filter also have the SAND layer? | Plastic-to-Energy: what does each of the TWO separate machines represent? Which one is the furnace/processing part and which is the generator + bulb? | Is the village toilet connected to the biogas plant in our model, or is it a separate toilet? | Does the windmill actually turn / produce electricity in the model, or is it only a display? | EV station: is the green light only a charging indicator, or does it also show the car battery getting charged? | Eco-friendly Ganesha: which clay and which daals did I use, are the daals inside the idol or on it, what colours and size is it, and where does it sit on the model? (Write it here so the website can be updated.)\n\n=== 5. DUSTBIN COLOURS ===\n- GREEN: Wet waste — Fruit & vegetable peels, leftover food, tea leaves, flowers (verified)\n- BLUE: Dry waste — Paper, cardboard, plastic, metal cans, glass bottles (verified)\n- BLACK: Domestic hazardous (special care) waste — Dead batteries, bulbs & tube lights, broken glass, paint containers (confirm with Ma'am)\n- RED: Sanitary waste — Used sanitary pads & diapers (wrapped in paper); in Chandigarh also used masks, gloves & bandages (confirm with Ma'am)\n- YELLOW: Biomedical waste (likely) — Soiled bandages & cotton, body waste from hospitals (confirm with Ma'am)\n- Chandigarh Municipal Corporation (homes): Green = wet · Blue = dry · Black = domestic hazardous · Red = sanitary (and, as per the 2026 draft bye-laws, home medical waste like used masks and bandages). Compulsory with fines since April 2026.\n- Solid Waste Management Rules, 2026 (all of India): Four streams: Wet · Dry · Sanitary · Special care. For bins in public places the rules say GREEN = wet, BLUE = dry, and RED = sanitary (in public toilets). No colour is set for special care waste or for bins at home.\n- Bio-Medical Waste Rules, 2016 (hospitals): Yellow = infectious & body waste · Red = contaminated plastic · White = sharps · Blue = glass & metal implants\n\n=== 6. HER STAGE SPEECH OUTLINE (4 Oct 2026) ===\n- Opening: Greet judges, teachers and friends; Name, class, topic; Question: where does all this waste go?; What you will show today\n- Clean India Mission: Swachh Bharat Abhiyan; 2 October 2014, PM Narendra Modi, Gandhi Ji's birth anniversary; Started with toilets for everyone; Cities: 63 lakh+ home toilets, 6 lakh+ community & public toilet seats — more than the target; Now ODF Plus: about 5.7 lakh villages also manage garbage and dirty water\n- Waste management & segregation: Separate → collect → transport → recycle/treat → safely dispose; Segregation at source is the most important step; Wet → compost/biogas; dry → recycling; Mixed waste = garbage; separated waste = resource\n- Plastic, eco-bricks & the Plastic Man: Single-use plastic: used for minutes, stays for a very long time; Eco-brick: bottle packed tightly with clean, dry plastic; Prof. Rajagopalan Vasudevan — plastic in roads; Padma Shri 2018\n- The 7Rs: 3Rs → 7Rs; Refuse, Reduce, Reuse, Repair, Repurpose, Recycle, Recover; The best waste is the waste we never create\n- Waste to energy: Waste that can't be recycled can still give energy; Biogas: microbes, no oxygen → gas for cooking/electricity; Waste-to-energy plants: closed, very hot, pollution control → steam → turbine; Never burn plastic in the open\n- Green energy & the hydrogen train: Green energy: renewable, very little pollution; Solar: sunlight → electricity; wind: moving air → electricity; India crossed 300 GW of clean power (July 2026); goal 500 GW by 2030; Green hydrogen; First hydrogen train: Jind–Sonipat, flagged off 17 July 2026; Main by-product: water vapour\n- Clean water & rivers: Multi-layer filter: coarsest → finest; Stones & gravel → sand → charcoal → cotton; Clearer is not always safe; Factories: effluent treatment plants; cities: sewage treatment plants; Never throw garbage or puja waste into rivers\n- Our duties & conclusion: What can WE do?; Stop littering; segregate; say no to single-use plastic; Plant trees; public transport; spread awareness; Not only a government programme — every citizen's responsibility; Final quote, Thank you, Jai Hind\n\n=== 7. HER FAVOURITE QUOTES ===\n- The best waste is the waste we never create. / सबसे अच्छा कचरा वह है, जो हम कभी बनाते ही नहीं।\n- A clean India starts with a clean thought, grows through a responsible action, and shines through a waste-free tomorrow. / स्वच्छ भारत एक स्वच्छ सोच से शुरू होता है, ज़िम्मेदार काम से आगे बढ़ता है, और कचरा-मुक्त कल में चमकता है।\n- A clean India is not just a dream; it is a responsibility we share. / स्वच्छ भारत सिर्फ़ एक सपना नहीं, यह हम सबकी ज़िम्मेदारी है।\n- Cleanliness is not a job we do because we are forced to. It is a good habit and a healthy way of life. / स्वच्छता कोई मजबूरी का काम नहीं, यह एक अच्छी आदत और जीने का स्वस्थ तरीका है।\n- Turn waste into energy, not pollution. / कचरे को प्रदूषण नहीं, ऊर्जा बनाइए।\n- Clean water is precious — treat it, reuse it, protect it. / पानी अनमोल है — इसे साफ़ करें, दोबारा इस्तेमाल करें, और बचाएँ।\n- Cleanliness should not be only for 2nd October — it should be an everyday habit. / स्वच्छता सिर्फ़ 2 अक्टूबर के लिए नहीं, यह हर दिन की आदत होनी चाहिए।\n\n=== 8. REAL JUDGE QUESTIONS AT MALERKOTLA (she won 1st prize) — what she said, and how to answer better in Delhi ===\n- Q: Why did you make an eco-friendly Ganesha? | She said: \"Ganesha made of plastic and POP is harmful to aquatic animals, so I used dissolved clay and daals to make it.\" | Coach: ✅ A good reason — the judges liked it! For Delhi, say WHY PoP harms (it does not break down easily; chemical paints can contain harmful metals), and say ‘clay that breaks down easily in water’ instead of ‘dissolved clay’. | Ideal points: Idols made of PoP (Plaster of Paris) do not dissolve easily: they stay in the water for a long time and change the water; Chemical paints can contain harmful metals (like lead and mercury), and plastic or thermocol decorations become litter; This can harm fish and other aquatic animals; So I made mine with clay that breaks down easily in water, and daals, which are natural and biodegradable; Best immersed at home in a bucket; the water goes to plants and the mud can be reused\n- Q: Which gas is present in biogas? | She said: \"methane and carbon dioxide\" | Coach: ✅ Correct! For Delhi, add: it is MAINLY methane (about 50–70%), and methane is the gas that burns. | Ideal points: Mainly methane (CH₄): about 50–70%, more than half; Carbon dioxide (CO₂): most of the rest; Small amounts of water vapour and hydrogen sulphide (rotten-egg smell), plus tiny traces of other gases; It is a mixture, not pure methane; the amounts change with the waste used; Methane is the gas that burns and gives heat for cooking\n- Q: What is Reduce? | She said: \"saying no\" | Coach: ⚠️ Careful — “saying no” is REFUSE (the 1st R). REDUCE means using LESS. Next time: “Reduce means using less — for example, writing on both sides of the paper.” Remember: Refuse = say NO, Reduce = use LESS. | Ideal points: Reduce means using LESS, so less waste is made; Examples: write on both sides of each page, take only as much food as you can eat, choose things with less packaging; Saying NO to things we don't need is Refuse (the 1st R); Reduce is the 2nd R; Using less also saves water, energy and money\n- Q: What are the other ways to use waste plastic? | She said: \"waste to energy and eco-brick\" | Coach: ✅ Good — both are real ways! For Delhi, add recycling and plastic roads, and say waste-to-energy is only for plastic that cannot be recycled. | Ideal points: First, Refuse and Reduce single-use plastic — the best waste is the waste we never create; Reuse or repurpose it (e.g. an old bottle as a plant pot); Recycle clean, segregated plastic into new things; Plastic roads: shredded plastic coats hot stones, which are then mixed with bitumen (Prof. R. Vasudevan, the Plastic Man of India); Eco-bricks: clean, dry plastic packed tightly into a bottle to build benches and small walls; Waste-to-energy (Recover) — only for plastic that cannot be recycled, in controlled plants, never open burning\n\n=== 9. NEXT LEVEL AND OFFICIAL RULES ===\n- Next: North Zone level, Delhi, 2026-10-24 to 2026-10-26. Same model.\n- Official marking (40): Neatness & order (सुघड़ता) 10 — Systematism & tidiness: a clean, well-arranged model. Labels straight and easy to read, no loose wires, nothing broken or dusty, everything in its place. Only 2 charts, and NO thermocol anywhere. | Showing how it works (कार्यविधि प्रदर्शन) 10 — Process presentation: show the demos working — the solar bulb, the EV light, water through the filter, the plastic-to-energy bulb. Go around in one path: City → Transport → Centre → Dustbins → Village → Water → Energy → Conclusion. | Explaining clearly (वर्णन अभिव्यक्ति) 10 — Description & expression: explain in your own words with a clear, steady voice. Judge → model → judge eye contact. Answer questions honestly — if you don't know, say what you DO know. | Written synopsis (लिखित प्रदर्श विवरणी) 10 — Written details: give the judges 2 copies of your synopsis — content, principle, how it works, and the list of parts. Neat and correct. (See 📘 Project → Written synopsis.)\n- Official Vidya Bharati Vigyan Mela 2026-27 rules (Model Exhibition). Zone fairs normally use the same rules — confirm with Rajnish Ma'am.\n- Rule: 2 written copies of your synopsis, with the list of parts (Bal Varg must list the parts)\n- Rule: Parent consent letter — needed at every level\n- Rule: Participation proforma signed by the sanyojaks — ask your school\n- Rule: School uniform — must be worn during the competition\n- Rule: Check every part: NO thermocol in any form (strictly banned). Replace any with cardboard\n- Rule: Measure the model: not bigger than 5 ft × 3 ft (about 152 cm × 91 cm)\n- Rule: Not more than 2 charts\n\n=== 10. DELHI AND INDIA UPDATES (fact-checked 15 October 2026; she may mention ONE or TWO, linked to a model part) ===\n- Opening line: Here in Delhi, old garbage mountains are being cleared, every home is being asked to separate its waste, and thousands of electric buses run on the roads. My model shows these same ideas in a Smart City and a Smart Village: my five dustbins, my biogas plant, solar power and a water filter.\n- [Garbage mountains, top line; links to: bins] SAY: Delhi is clearing its three big garbage mountains, at Okhla, Bhalswa and Ghazipur. By early October 2026, more than 200 lakh tonnes of old garbage had been dug out and cleared. Nearly 100 acres of land was free again. On 3 October 2026, foundation stones were laid for new plants. These plants will treat fresh garbage every day, so that new mountains do not grow. | LINK: This is why my five dustbins matter: when every home separates its waste, much less of it ends up on a garbage mountain. | MENTOR NOTE: Exact figure: 217.17 lakh MT disposed of from Okhla, Bhalswa and Ghazipur, freeing nearly 100 acres (CM Rekha Gupta, 3 Oct 2026; ThePrint, Daily Pioneer 4 Oct). By site on 31 Aug 2026: Okhla about 70 lakh MT/35 acres, Bhalswa about 102 lakh MT/45 acres, Ghazipur about 44 lakh MT/20 acres. The total covers work since July 2022, so never say 'in 18 months' or 'this year'. It grows every week, so keep 'more than 200 lakh tonnes' plus the month. Foundation stones on 3 Oct 2026: fresh-waste plants at Okhla (1,400 TPD), Ghazipur (800 TPD) and Singhola (700 TPD), plus a 300 TPD biogas plant at Ghazipur. Contracts for about 5,900 TPD at five sites were awarded in July 2026 (including Bhalswa 1,800 and Narela-Bawana 1,200). These plants are being built and are not running yet. Do NOT say any landfill is 'finished'. Do NOT say bamboo is growing there: that claim was dropped because ThePrint (2 Oct 2026) found the Bhalswa bamboo patch under a new mound. Avoid the activist criticism that waste is 'moved, not removed'. Web re-check on 15 Oct 2026: no figure newer than 217.17 lakh MT (Business Today, 31 Aug, gave 216 lakh MT) and no 'Bhalswa cleared' announcement. Re-check on 23 Oct.\n- [Garbage mountains; links to: pots] SAY: By early October 2026, about 70 lakh tonnes of old garbage had been cleared from the Okhla landfill. About 35 acres of land was free again, and it is being made into a park. The target to clear Okhla and Bhalswa is December 2026. | LINK: Old garbage land can turn green again, like the park with two flower pots at the centre of my model. | MENTOR NOTE: The Hans India (4 Oct 2026), on the CM's visit of 3 Oct: about 70 lakh MT biomined, nearly 35 acres freed, and the area 'being developed into a park'. The MCD target for final clearance of Okhla and Bhalswa is December 2026. The Tribune (9 Jul 2026) confirms the target and says the Okhla site is about 62 acres in all. Daily Pioneer (4 Oct) says almost all of Okhla's pre-January-2025 legacy waste has been processed. Bhalswa: about 70-acre site; 99.07 lakh MT remediated by 31 Jul 2026 (DD India/AIR); fresher figure about 102 lakh MT and 45 acres by 31 Aug 2026 (CM, ETV Bharat 31 Aug). The Mayor said 4–5 lakh tonnes were left on 29 Aug 2026. AIR/Construction World (1 Aug 2026) said the remaining mound was 'expected' by 15 Oct and all waste up to March 2026 would be cleared by 31 Dec 2026; a web re-check on 15 Oct 2026 found no 'cleared' or 'completed' announcement. Deadlines have slipped before, so say 'target', never 'finished'. Don't mention bamboo (dropped claim).\n- [Garbage mountains; links to: wte] SAY: The garbage dug out of Delhi's landfills is not wasted. Most of it becomes fuel for cement factories and paper mills. Broken bricks and concrete become tiles and paver blocks, and the soil is used to fill low land. The target to clear the Ghazipur landfill is December 2027. | LINK: This is the 'Recover' idea behind my plastic-to-energy machine: waste that cannot be recycled becomes fuel. | MENTOR NOTE: From Delhi's presentation at the SBM-Urban 2.0 national review, 19–20 May 2026 (TheNewsMill/ANI, 21 May). 70–75% of biomined material is refuse-derived fuel (RDF), sent to cement factories in Chittorgarh and paper mills in Shamli and Muzaffarnagar. 15–20% is construction and demolition waste, made into tiles, paver blocks and stone dust. 5–10% is inert soil, used for low-lying land, NTPC eco-park pits and NHAI highways. The work is funded with Rs 776.47 crore under SBM-U 2.0. Ghazipur: heights were cut by 10–15 m in places, NTPC began lifting about 40 lakh MT of inert material to its eco-park about 23 km away, and the target for complete remediation is December 2027 (Tribune, 9 Jul 2026). 'Burns less coal' is our inference, not a quote, so say 'used as fuel'. Ghazipur's date is a target. Don't call Ghazipur 'the biggest' or 'the hardest' site on stage: the by-site figures (Bhalswa about 102 lakh MT cleared, Ghazipur about 44 lakh MT by 31 Aug 2026) invite a challenge.\n- [Garbage mountains; links to: general] SAY: In 2014, India's cities processed only 16% of their waste. By May 2026, they processed about 81%. Processing means turning waste into compost, recycled things or energy. By May 2026, 97% of city wards also had door-to-door garbage collection. | LINK: My biogas plant and my plastic-to-energy machine show two of these ways to process waste. | MENTOR NOTE: MoHUA national review of SBM-Urban 2.0, 19–20 May 2026, Vigyan Bhawan (Tribune 21 May; Construction World 25 May). Processing rose from 16% (2014) to 81% (2026), and door-to-door collection covers 97% of wards. About 65% of roughly 26 crore tonnes of legacy waste at 2,482 dumpsites has been remediated, reclaiming nearly 9,000 acres. DD India (21 Sep 2026): 3.66 crore MT was remediated in calendar 2025, and 459 cities in 29 states have fully cleared their dumpsites. The percentage is based on processing capacity reported by cities, not an independent audit (an earlier Rajya Sabha reply gave about 80.26%), so say 'about 81%'. Note: 459 counts CITIES (ULBs) that have cleared ALL their dumpsites; her dumpsite card's 'more than 1,000 cleared' counts DUMPSITES (out of about 2,500). They are different measures, so don't combine them.\n- [Segregation & compost, top line; links to: bins] SAY: Since 1 April 2026, India's new waste rules say every home must separate its garbage into four types: wet, dry, sanitary and special care. On 2 October 2026, the Municipal Corporation of Delhi (MCD) held a special meeting to make this work in every ward of the city. Delhi's target is that all its waste is separated by January 2027. | LINK: All four types fit my dustbins. In Chandigarh's system, green is for wet, blue for dry, red for sanitary, and black for special-care waste like bulbs and batteries. | MENTOR NOTE: SWM Rules 2026: notified by MoEFCC on 27 Jan 2026 and in force from 1 Apr 2026, replacing the 2016 rules. They set four streams: wet, dry, sanitary and special care. Bulk generators (100 kg/day, 20,000 sq m or 40,000 L of water a day) must treat wet waste on site. Unsegregated waste pays a higher landfill fee, and a central portal will track waste. Bin colours at home are NOT fixed nationally (only public bins have rule colours: green for wet, blue for dry, and red for sanitary in public toilets), so black and red at home follow Chandigarh's system: confirm with Rajnish Ma'am. MCD special meeting on 2 Oct 2026, chaired by Deputy Mayor Monika Pant; no deadlines were announced (Tribune, 3 Oct). Delhi Economic Survey 2025-26 (24 Mar 2026): segregation is about 92% in NDMC, up to 90% in Cantonment and about 59% in MCD. January 2027 is a target, not an achievement. Mayor Pravesh Wahi urged four-category segregation on 29 Aug 2026.\n- [Segregation & compost, top line; links to: bins] SAY: The New Delhi Municipal Council (NDMC) gives the title 'Anupam Colony' to colonies that aim for zero waste. These colonies separate their waste into five types: dry, wet, sanitary, garden waste and e-waste. They make compost from wet waste and sort dry waste for recycling. In June 2026, Sangli Apartments became the eighth Anupam Colony. | LINK: Like my model, these colonies use five separate groups for waste instead of mixing everything in one bin. | MENTOR NOTE: Daily Pioneer (23 Jun 2026): Sangli Apartments, Copernicus Marg, was certified on 22 Jun 2026 as NDMC's eighth Anupam Colony. Criteria: 100% segregation into five categories (dry, wet, sanitary, horticulture, e-waste), on-site composting of wet and garden waste, a Material Recovery Facility for dry waste, a Reduce-Reuse-Recycle centre and a 'Neki Ki Diwar' (a wall where people leave things for others to reuse). Jor Bagh was also reported as one, but this was not verified. Her five bins are a DIFFERENT five (hazardous and (probably) biomedical instead of garden waste and e-waste; confirm the yellow bin with Rajnish Ma'am), so say 'five groups, like my model', never 'the same five bins'. Say 'aim for zero waste', not 'zero-waste colonies'. NDMC segregation is about 92% (Economic Survey, March 2026). This is a good link to her 'Reduce' answer.\n- [Segregation & compost; links to: pots] SAY: The New Delhi Municipal Council (NDMC) makes compost from wet waste and garden leaves at its nursery in Chanakyapuri, New Delhi. By early October 2026, it had given 1,250 kg of this compost to 11 schools. It planned to give 3,000 kg more to 30 schools. | LINK: Compost from wet waste feeds plants, like the two flower pots in the park of my model. | MENTOR NOTE: Millennium Post (9 Oct 2026) and UNI (8 Oct): the compost is made at NDMC's Hi-Tech Nursery, Madhu Limaye Marg, Chanakyapuri, in wire-mesh 'rounders', and it matures in 2–3 months. On 8 Oct 2026, 1,000 kg went to Lok Niwas (the Lieutenant Governor's office). Under Swachhata Hi Seva 2026, 1,250 kg went to 11 schools, and 3,000 kg was planned for 30 more (the research detail says '30 more schools'; its source check says '30 schools', so the stage line says only '30 schools', which is true either way). A related report says NDMC workers made about 13,000 kg of compost in the past year (Sep 2026). Composting uses air (aerobic) and biogas does not (anaerobic), which is a good viva contrast. Say '3,000 kg was planned', not 'given'.\n- [Biogas & waste-to-energy, top line; links to: wte] SAY: Delhi has four waste-to-energy plants, at Okhla, Ghazipur, Narela-Bawana and Tehkhand. Delhi's Economic Survey (March 2026) says that together they can make about 84 megawatts of electricity from garbage. Delhi plans to make two of these plants bigger and to build two new ones, with target dates in 2027 and 2028. | LINK: My plastic-to-energy machine is a model of the same idea: heat from waste makes steam, and the steam helps make electricity. | MENTOR NOTE: Delhi Economic Survey 2025-26 (Daily Pioneer, 24 Mar 2026): four WtE plants with 6,550 TPD capacity and about 84 MW. Delhi generates about 11,862 TPD (MCD 11,500, NDMC 300, Cantonment 62), but installed processing is only 7,641 TPD (about 64%). Planned targets: Okhla +1,000 TPD to 2,950 by 2027 (ThePrint: by March 2027), Tehkhand +1,000 to 3,000 by 2027, a new 3,000 TPD plant at Narela-Bawana by Dec 2027, and a new 2,000 TPD plant at Ghazipur by Dec 2028. An MCD affidavit to the NGT said the Ghazipur plant did not operate from April to December 2025, so don't claim all four always run, and don't say garbage powers the Delhi Metro. Capacity figures differ a little between sources, so '4 plants, about 84 MW' is safest. Only non-recyclable dry waste should go for energy. India's first WtE plant, at Timarpur in Delhi (1987), failed; experts say a big reason was that the waste was too wet and poor to burn well (as on her WtE card).\n- [Biogas & waste-to-energy, top line; links to: biogas] SAY: Delhi's first big biogas plant is at Nangli Dairy. It is built to turn 200 tonnes of cow dung a day into biogas and compost. In July 2026, the Municipal Corporation of Delhi (MCD) signed an agreement to collect dung from about 1.25 lakh cattle. The plan is to turn this dung into biogas and manure, so that it does not go into the Yamuna. | LINK: It is the same science as the biogas plant in my Smart Village: dung rots without oxygen and gives methane gas. | MENTOR NOTE: Nangli: inaugurated on 20 Sep 2025 by CM Rekha Gupta (commissioned 17 Oct 2025, per a World Biogas Association brief). It is designed for 200 MT/day, cost Rs 16 crore, is on 2.7 acres and was part-funded by MoHUA. Planned output is about 5,600 kg of compressed biogas for Indraprastha Gas Ltd by pipeline, plus about 30 t of compost a day. The dung comes from Nangli (about 13,000 cattle) and Kakrola (about 7,000) dairies. It ran on trial at about 25 TPD at launch, and no 2026 output data was found, so always say 'built to'. Say 'biogas', not 'clean gas' (biogas also contains CO2; her biogas careful note says 'cleaner', not pollution-free). MoU: MCD and the National Dairy Development Board, 15 Jul 2026 (Amit Shah, the CM, the LG and the Mayor were present; names not for stage). It covers about 1,500 MT of dung a day. Owners are to get Rs 1/kg (a plan, so say 'will get'). Processing will be at Nangli, Ghogha-Goyla and Ghazipur. The goal is no untreated wastewater in the Yamuna by Dec 2028. National link: in August 2026 the Union Cabinet approved the Rs 23,731 crore GOBARdhan National Circular Bioenergy Scheme (PIB 7 Aug; some say 6 Aug), running FY2026-27 to 2035-36 under the Ministry of Petroleum and Natural Gas. It is already on her biogas page.\n- [Biogas & waste-to-energy; links to: biogas] SAY: In September 2025, a plant opened at Ghogha Dairy in Delhi that can turn 100 tonnes of city garbage a day into biogas fuel. In July 2026, MCD and Oil India agreed to build two more plants, at Tehkhand and Okhla. Together, they are meant to take 800 tonnes of wet waste a day, such as kitchen waste. These plants will make Bio-CNG: biogas that is cleaned so it can be used like CNG. | LINK: This is why wet waste must go in the green bin: clean, separated kitchen waste is what a biogas plant needs. | MENTOR NOTE: Ghogha Dairy: a 100 TPD municipal-solid-waste-to-CBG plant opened by the CM about 26 Sep 2025 (BioEnergy Times, 27 Sep 2025). It makes about 4 t of gas a day, has two digesters (6,000 cubic metres) and a CBG-CNG fuel station, and came from a 2022 MCD–IGL agreement. This fact is about a year old and was not re-confirmed in 2026, so say 'opened', not 'runs'. Oil India MoU, 30 Jul 2026 (NSE filing; Asianet 31 Jul; Biltrax): Tehkhand 500 TPD (about 10 acres) and Okhla 300 TPD (about 7 acres) of segregated wet waste. Oil India will invest about Rs 400 crore, and about 30–32 TPD of CBG will go through its pipeline network. Some reports call Tehkhand 'Tughlakabad'. It is an agreement, not a working plant, so never say Delhi 'is making' gas from kitchen waste. Also: a foundation stone for a 300 TPD biogas plant for biodegradable waste at Ghazipur was laid on 3 Oct 2026. Vision only, with no timeline: Union Minister Nitin Gadkari said on 6 Jul 2026 that segregated garbage could make hydrogen for Delhi's buses. Don't present that as a plan.\n- [Clean air & transport, top line; links to: bus] SAY: On 13 October 2026, 150 new electric buses started running in Delhi. After that, Delhi had more than 5,200 electric buses. The Delhi Government says no other city in India has so many electric buses. | LINK: One electric bus carries many people without tailpipe smoke, like the two electric buses at my bus stand. | MENTOR NOTE: ETV Bharat and UNI (12–13 Oct 2026): on 13 Oct 2026, CM Rekha Gupta and Union Environment Minister Bhupender Yadav flagged off 150 e-buses at Anand Vihar ISBT. This took the electric fleet to 5,238 out of about 6,988 buses (about 1,750 run on CNG). The new buses are low-floor AC with CCTV, panic buttons, live tracking and disability access. Earlier there were 5,088 e-buses from 40 depots (21–23 Sep 2026). 'Biggest fleet' is the Delhi Government's own claim (ThePrint/PTI, Feb 2026; Electrive repeats it; the 13 Oct ETV Bharat report does not repeat it), so keep 'the Delhi Government says'. ETV Bharat (13 Oct) also confirms 5 public EV charging stations (naming only Anand Vihar ISBT), 13 new air-quality stations (60 in all) and 34 Air-Guardian teams. Plans: make the whole DTC fleet electric and reach about 14,000 buses by 2028-29 (repeated on 13 Oct). The nearer target is 7,500 buses, including 5,800 electric, by March 2027. DEVI (Delhi Electric Vehicle Interconnector) uses 9-metre e-buses for narrow lanes, linking homes to Metro stations (since 2025). Delhi–Karnal AC e-buses started from Kashmere Gate in Aug 2026 (5 buses, 10 trips each way a day, per AIR 19 Aug). School e-buses: 24 for Sardar Patel Vidyalaya (Aug 2025, no 2026 update). A pre-event report (Swarajya, 10 Oct) spoke of 200 buses on 14 Oct and a 7,000 fleet, but no report confirmed it. Re-check on 23 Oct for any new flag-off: 'more than 5,200' stays true if the fleet grows.\n- [Clean air & transport; links to: train] SAY: In May 2026, Delhi Metro and IndianOil started a trial service of two hydrogen buses near India Gate in New Delhi. A fuel cell in each bus joins hydrogen with oxygen from the air to make electricity. So the main thing that comes out is water vapour, not smoke. | LINK: These buses use fuel cells, the same idea as the hydrogen train in my model. | MENTOR NOTE: ETV Bharat (15 May 2026): launched on 15 May 2026 by DMRC with IndianOil, jointly with MoHUA and the Ministry of Petroleum. Route: Central Secretariat to Seva Teerth Metro stations, looping past Kartavya Bhawan, Vigyan Bhawan, Nirman Bhawan, National Stadium and India Gate. There are 2 buses, 12 m long with 35 seats each, using a 70 kW PEM fuel cell with hydrogen stored at 350 bar. They ran on weekdays, 8:30am–12:30pm and 3:30–6:30pm, every 30 minutes, with fares of Rs 10/15. It was described as a trial. Media called it 'India's first hydrogen shuttle', but earlier hydrogen bus trials ran (for example in Leh and earlier IndianOil trials), so don't say 'India's first'. No Sep–Oct 2026 report confirms it is still running: say 'started in May 2026', never 'runs' or 'there are hydrogen buses in Delhi'.\n- [Clean air & transport; links to: train] SAY: On 17 July 2026, India's first hydrogen train was flagged off between Jind and Sonipat in Haryana, close to Delhi. The main thing that comes out of it is water vapour, not diesel smoke. | LINK: This is the train in my model, the one with the Jind–Sonipat label. | MENTOR NOTE: IANS and DT Next (17 Jul 2026): PM Narendra Modi flagged it off at Jind. The route is 89 km Jind–Gohana–Sonipat, about 2 hours, with 12 intermediate stations. It has 10 coaches (2 power cars and 8 passenger coaches) for about 2,600 passengers, and was built at ICF Chennai. Commercial service was due to start on 19 Jul 2026 (Northern Railway CPRO, Republic World 18 Jul), with fares of Rs 10–25. Power ratings differ between sources, so don't quote kW or HP. Likely only (ThePrint/PTI, 17 Sep 2026): Railways is studying an extension to Azadpur in Delhi, because only 40–60 people ride per trip and it makes one return trip a day; the decision will be taken 'after due consideration'. This is mentor-only (a 'likely' item): do not raise it on stage, and never mention low ridership. As of 15 Oct 2026 no decision had been reported (latest: ThePrint/PTI 17 Sep; Business Today 20 Sep). Check the news again on 23 Oct.\n- [Clean air & transport; links to: ev] SAY: Delhi's new EV Policy, for electric vehicles, started on 1 July 2026. From 1 January 2027, every new auto registered in Delhi must be electric. From 1 April 2028, every new scooter and motorbike must be electric too. On 13 October 2026, five new public charging stations for electric vehicles opened in Delhi, including one at the Anand Vihar bus terminal. | LINK: My EV charging station shows why charging points matter: electric vehicles need them the way petrol cars need petrol pumps. | MENTOR NOTE: Delhi EV Policy 2026 was notified on 1 Jul 2026 (DTNext; ThePrint/PTI). It is valid to 31 Mar 2030, with about Rs 15,000 crore over four years. From 1 Jan 2027, only electric autos (and N1 goods vehicles, per Electrive) can be newly registered; from 1 Apr 2028, only electric two-wheelers. The e-two-wheeler subsidy is Rs 30,000, then 20,000, then 10,000 in years 1–3. E-cars up to Rs 30 lakh are exempt from road tax and the registration fee, and there is a scrappage incentive. More than 30,000 charging points are planned (the CM and Electrive say 32,000 by 2030). The count of existing chargers is disputed (about 9,000 per the CM in July 2026; '10,000+' in one PTI report that includes private chargers), so don't quote a current number. On 13 Oct 2026, five public charging stations were inaugurated; the post-event ETV Bharat report (13 Oct) names only Anand Vihar ISBT. The DTC depots (Nand Nagri, Rohini Sector-37, Nangloi, Keshopur) come from UNI's pre-event report of 12 Oct, written in the future tense, so name only Anand Vihar on stage. The rules are for NEW registrations: never say petrol scooters are banned.\n- [Clean air & transport; links to: wte] SAY: In Delhi, burning garbage, leaves or plastic in the open is not allowed. Anyone who does it can be fined ₹5,000 on the spot. Delhi's Winter Action Plan 2026-27 asks people to report such burning on the 311 helpline or the Green Delhi App. | LINK: At my plastic-to-energy machine I say the same thing: never burn plastic in the open; put it in the right dustbin. | MENTOR NOTE: The Tribune (10 Dec 2025): a Delhi Environment Department order set a Rs 5,000 on-the-spot environmental fine for burning leaves, garbage, plastic or rubber in the open. It follows NGT orders (Vardhaman Kaushik vs Union of India, 2014–15). Sanitary inspectors and deputy tehsildars collect it, and MCD, NDMC, the Cantonment and the districts report monthly to DPCC. Open burning is a major local source of PM2.5 and PM10. The Winter Action Plan 2026-27 was announced on 29 Sep 2026 by Environment Minister Manjinder Singh Sirsa (name not for stage; Republic/ANI). It includes the 311 helpline and Green Delhi App, 334 enforcement teams, 'No PUCC – No Fuel' at 500 pumps and an AI command centre. On 13 Oct 2026, 13 new air-quality monitoring stations opened, making 60 in all, and 34 'Air-Guardian' teams watch burning hotspots (ETV Bharat). Most winter measures start on 1 Nov 2026, after her event, so don't say they are in force. The national NGT 2016 fines (Rs 5,000, or Rs 25,000 for bulk burning) are on her open-burning card.\n- [Solar & clean energy, top line; links to: solar] SAY: In September 2026, the Delhi Government announced a new solar plan. Homes that use up to 400 units of electricity a month can get a 3-kilowatt solar system on their roof. They pay nothing at the start. Help comes from the Government of India's PM Surya Ghar scheme and from the Delhi Government. The goal is about 2.3 lakh homes and 500 megawatts by March 2027. | LINK: The buildings in my Smart City have solar panels too, and one of them is a real panel that lights a bulb. | MENTOR NOTE: Energetica India and SolarQuarter (2 Sep 2026): the Delhi Cabinet approved the second amendment to the Delhi Solar Energy Policy 2023 on 1 Sep 2026. The subsidy is Rs 78,000 from the Centre (PM Surya Ghar) plus Rs 78,000 from Delhi, and Delhi covers the rest. A 3 kW system costs about Rs 1.75 lakh (not separately confirmed). There are 5 years of free maintenance and no fee up to 10 kW, and net-metering approval was cut from 75 to 25 days. IPGCL runs the scheme by competitive bidding. There were about 10,073 rooftop installations in Delhi at that time. 2.3 lakh homes / 500 MW by March 2027 is a target. No October rollout update was found, so say 'announced', not 'homes have got it'. On stage say 'the Government of India's PM Surya Ghar scheme', not 'the Centre's'. Extra Delhi solar facts (2025) if a judge asks: Delhi Metro has rooftop solar on 93 stations and 15 depots, and it opened India's first vertical bifacial solar plant at Okhla Vihar station on 18 Feb 2025. About one-third of Metro power is renewable, mostly from the Rewa solar park in Madhya Pradesh (Tribune, Oct 2025).\n- [Solar & clean energy; links to: solar] SAY: By August 2026, about 50 lakh homes across India had rooftop solar panels under the PM Surya Ghar Muft Bijli Yojana. In July 2026 alone, about 5 lakh homes got panels, the most in any month up to then. | LINK: If more roofs had solar panels like the buildings in my Smart City, we would need to burn less coal. | MENTOR NOTE: MNRE via IANS and Mercom (4 Aug 2026): more than 50.06 lakh households and 14.8 GW. But the same Mercom article quotes the minister giving 39.7 lakh systems benefiting about 48 lakh households in July, so say 'about 50 lakh'. July 2026 had 5.06 lakh installations (about 16,328 a day, up from 5,038 a day in Oct 2025), the highest month at that time. A web re-check on 15 Oct 2026 found no Aug or Sep 2026 monthly figure, so July may since have been beaten: say 'the most in any month up to then', never 'the record month'. Rs 28,024 crore has been paid by DBT out of a Rs 75,021 crore outlay, and the target is 1 crore homes by March 2027. Delhi: 17,481 PM Surya Ghar installations, 69.81 MW (May 2026). National clean energy (already on her site): 300.5 GW of non-fossil capacity by 31 Jul 2026. Likely only, so mentor-only: solar crossed 171 GW by end-September 2026 (SolarQuarter citing MNRE). Capacity is not the same as electricity generated.\n- [Yamuna & clean water, top line; links to: filter] SAY: Delhi has one of Asia's biggest sewage treatment plants, at Okhla. Sewage is the dirty water from our homes. This plant can clean 564 million litres of it a day, from about 40 lakh people. It can also make 4.8 megawatts of electricity from biogas! | LINK: My filter shows only the first, simple step of cleaning water. A big plant like Okhla does much more, and it can even make biogas, like my Smart Village. | MENTOR NOTE: The Tribune (10 Apr 2025) and Millennium Post (24 Sep 2025): 564 MLD (about 124 MGD), called 'Asia's largest single-stage' wastewater plant, so say 'one of Asia's biggest'. It serves about 40 lakh people in Old, Central and South Delhi and NDMC areas. It uses activated sludge (bacteria), disc filters and UV disinfection, with SCADA monitoring. 4.8 MW from sludge biogas meets nearly half its own power needs. It makes India's first 'Class-A' sludge, usable as fertiliser. It intercepts about 35 MGD of sewage from the Barapullah and Maharani Bagh drains, and about 40 MLD of treated water has been used for horticulture since June 2024. Cost Rs 1,161 crore, 40 acres, built under Yamuna Action Plan-III (85% Centre, 15% Delhi). These facts are from 2025, so the stage line says 'can clean' and 'can make'; an October 2026 Ganga task-force meeting (ANI, 8 Oct) mentions river flows from the Okhla STP, so it is operating. Treated water is NOT drinking water. 1 MGD is about 4.5 million litres; 564 million litres is about 56 crore litres.\n- [Yamuna & clean water; links to: filter] SAY: In August 2026, Delhi's sewage treatment plants could clean about 814 million gallons of dirty water a day. A gallon is about four and a half litres. The target is about 1,041 million gallons a day by the end of 2027. Delhi is also setting up 28 new small sewage plants. | LINK: My filter shows only the first, simple step of cleaning water; sewage plants do much more, and they stop dirty water from going straight into the river. | MENTOR NOTE: PTI (29 Jan 2026): 37 STPs. Capacity rose from 707 MGD (Feb 2025) to 814 MGD (Nov 2025), and plants meeting the stricter 10/10 standard rose from 16 to 28 of 37. The Delhi Jal Board told the Delhi High Court on 24 Aug 2026 that capacity was 814.26 MGD, with a target of 1,041.10 MGD by 31 Dec 2027 (SCC Online, 27 Aug). DJB's 179th meeting (Jul 2026) approved 15 new decentralised STPs (about 103.5 MGD, about Rs 2,000 crore); with 13 approved earlier, 28 are under implementation (completion around 2028). It also approved 989 km of sewers in 244 colonies and 57 villages, and Rs 274 crore for sludge. Sources differ on how much the 28 plants add, and 1,041 needs ALL approved projects, not only the 28, so don't link the two. 814 is installed CAPACITY, not sewage actually treated. Delhi makes about 1,000 MGD, some colonies have no sewers, and the river is still polluted, so never say the Yamuna is clean. Do NOT quote the January 2026 '1,500 MGD / Mission 2028' figure on stage. Dropped: the NMCG approval of Rohini and Pappankalan STPs (one outlet, 13 Oct 2026); don't use it unless an official release appears. Namami Gange (Ganga basin, including the Yamuna): 147 sewerage projects completed, 4,339 MLD (as of Aug 2026), and drones survey Delhi's drains. MGD here means million (imperial) gallons a day; 1 gallon is about 4.5 litres.\n- [Yamuna & clean water; links to: filter] SAY: In April 2026, Delhi put two trash-skimmer machines on the Najafgarh drain. They pick up floating plastic and water weeds before they can reach the Yamuna. | LINK: They work like the top layer of stones in my filter: catch the big rubbish first. | MENTOR NOTE: The Tribune and Daily Pioneer (5 Apr 2026): two dual-purpose weed-harvester-cum-trash-skimmers (Rs 2.90 crore for both, 112 HP
